<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Crusoe College — Exam Seating Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --navy: #0d5c2e; --blue: #177a3d; --accent: #c8a020; --green: #1a5c22;
    --red: #b83232; --purple: #5a3a8a; --light: #f4f6fb; --border: #dce3f0;
    --text: #1a2540; --muted: #6b7a99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }
  button { font-family: 'DM Sans', sans-serif; cursor: pointer; }
  input, select, textarea { font-family: 'DM Sans', sans-serif; font-size: 0.88rem; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); background: white; }
  input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; display: block; margin-bottom: 4px; }

  header { background: linear-gradient(135deg, #0a4a24 0%, #0d5c2e 60%, #177a3d 100%); color: white; padding: 14px 28px 0; }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .header-title h1 { font-family: 'DM Serif Display', serif; font-size: 1.45rem; }
  .header-title p { font-size: 0.76rem; opacity: 0.65; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .session-badge { background: var(--accent); color: #1a1a00; font-weight: 700; font-size: 0.82rem; padding: 5px 14px; border-radius: 20px; }
  .sync-pill { font-size: 0.72rem; font-weight: 600; padding: 5px 12px; border-radius: 20px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa; }
  .sync-pill.ok .sync-dot { background: #5be07f; }
  .sync-pill.saving .sync-dot { background: var(--accent); animation: pulse 1s infinite; }
  .sync-pill.err .sync-dot { background: #ff7070; }
  .sync-pill.local .sync-dot { background: #8fb7ff; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .hbtn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; padding: 7px 14px; font-size: 0.78rem; font-weight: 500; transition: background 0.2s; }
  .hbtn:hover { background: rgba(255,255,255,0.28); }
  .hbtn.gold { background: var(--accent); color: #1a1a00; border-color: transparent; font-weight: 700; }
  .hbtn.gold:hover { background: #dab332; }

  nav { display: flex; gap: 2px; margin-top: 14px; flex-wrap: wrap; }
  nav button { border: none; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.65); font-size: 0.82rem; font-weight: 500; padding: 10px 18px; border-radius: 8px 8px 0 0; transition: all 0.2s; }
  nav button:hover { background: rgba(255,255,255,0.15); color: white; }
  nav button.active { background: var(--light); color: var(--navy); font-weight: 700; }
  nav button.editor-only { display: none; }
  body.is-editor nav button.editor-only { display: block; }

  main { padding: 24px 28px 60px; max-width: 1500px; margin: 0 auto; }

  .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
  .section-head h2 { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: var(--navy); }
  .section-head p { font-size: 0.8rem; color: var(--muted); margin-top: 2px; max-width: 680px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { background: var(--navy); color: white; border: none; border-radius: 8px; padding: 9px 16px; font-size: 0.82rem; font-weight: 600; transition: background 0.2s, transform 0.1s; }
  .btn:hover { background: var(--blue); }
  .btn:active { transform: scale(0.97); }
  .btn.secondary { background: white; color: var(--navy); border: 1.5px solid var(--border); }
  .btn.secondary:hover { border-color: var(--blue); background: #f0f7f2; }
  .btn.danger { background: var(--red); }
  .btn.danger:hover { background: #d44; }
  .btn.gold { background: var(--accent); color: #1a1a00; }
  .btn.gold:hover { background: #dab332; }
  .btn.small { padding: 5px 10px; font-size: 0.72rem; }
  .pill { font-size: 0.68rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .pill.completing { background: #e6f4ec; color: var(--green); }
  .pill.special { background: #ede8f7; color: var(--purple); }
  .pill.withdrawn, .pill.exemption { background: #fce8e8; color: var(--red); }
  .muted { color: var(--muted); font-size: 0.8rem; }
  .empty-msg { text-align: center; color: var(--muted); padding: 44px 20px; font-size: 0.9rem; background: white; border: 2px dashed var(--border); border-radius: 12px; }
  .view-note { background: #fdf6e0; border: 1px solid #ecd9a0; color: #7a5c00; border-radius: 10px; padding: 10px 16px; font-size: 0.8rem; margin-bottom: 16px; display: none; }
  body:not(.is-editor) .view-note { display: block; }
  body:not(.is-editor) .editor-only { display: none !important; }

  .session-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .session-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 2px 10px rgba(15,31,61,0.07); border-top: 4px solid var(--border); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .session-card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(15,31,61,0.13); }
  .session-card.active { border-top-color: var(--accent); }
  .session-card h3 { font-family: 'DM Serif Display', serif; font-size: 1.15rem; color: var(--navy); }
  .session-card .sc-sub { font-size: 0.78rem; color: var(--muted); margin: 3px 0 12px; }
  .session-card .sc-stats { display: flex; gap: 14px; font-size: 0.78rem; margin-bottom: 12px; }
  .session-card .sc-stats b { font-size: 1.05rem; color: var(--blue); display: block; font-family: 'DM Serif Display', serif; }
  .session-card .sc-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .table-wrap { background: white; border-radius: 12px; overflow: auto; box-shadow: 0 2px 10px rgba(15,31,61,0.07); max-height: 65vh; }
  table.data { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  table.data th { background: var(--navy); color: white; padding: 9px 12px; text-align: left; font-weight: 600; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
  table.data td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  table.data tr:hover td { background: #f0f4ff; }
  table.data .t-last { font-weight: 700; text-transform: uppercase; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filter-bar input[type=text] { min-width: 220px; }

  .room-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .room-card { background: white; border-radius: 12px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(15,31,61,0.07); border-left: 5px solid var(--blue); }
  .room-card.special { border-left-color: var(--purple); }
  .room-card.withdrawn { border-left-color: var(--red); }
  .room-card h3 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--navy); }
  .room-card .rc-sub { font-size: 0.76rem; color: var(--muted); margin: 3px 0 10px; }
  .room-card .rc-actions { display: flex; gap: 6px; }

  .seating-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: white; border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 10px rgba(15,31,61,0.07); margin-bottom: 16px; }
  .tb-divider { width: 1px; height: 26px; background: var(--border); margin: 0 4px; }
  .room-banner { display: flex; align-items: center; gap: 12px; margin: 20px 0 10px; padding: 11px 16px; border-radius: 10px; color: white; background: linear-gradient(90deg, #0d5c2e, #177a3d); }
  .room-banner.special { background: linear-gradient(90deg, #5a3a8a, #7b52b5); }
  .room-banner.withdrawn { background: linear-gradient(90deg, #b83232, #d44444); }
  .room-banner h3 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; }
  .room-banner span { font-size: 0.76rem; opacity: 0.85; margin-left: auto; }
  .seat-grid-wrap { overflow-x: auto; background: white; border-radius: 10px; padding: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
  .seat-table { border-collapse: separate; border-spacing: 4px; }
  .seat-table th { font-size: 0.64rem; color: var(--muted); font-weight: 600; padding: 2px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .seat-cell { width: 96px; min-width: 96px; height: 46px; border: 1.5px solid var(--border); border-radius: 7px; background: #fafbff; padding: 3px 6px; vertical-align: top; font-size: 0.66rem; position: relative; }
  .seat-cell .sc-first { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat-cell .sc-lastn { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; color: var(--text); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.is-editor .seat-cell { cursor: pointer; }
  body.is-editor .seat-cell:hover { border-color: var(--blue); background: #eef7f1; }
  .seat-cell.selected { border-color: var(--accent) !important; background: #fdf3d8 !important; box-shadow: 0 0 0 2px var(--accent); }
  .seat-cell.conflict { border-color: var(--red); background: #fce8e8; }
  .seat-cell.conflict::after { content: '!'; position: absolute; top: 0; right: 4px; color: var(--red); font-weight: 700; font-size: 0.7rem; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 7px; background: white; border-radius: 10px; padding: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
  .chip { border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; background: #fafbff; }
  .chip b { text-transform: uppercase; }
  .unseated-panel { background: #fdf6e0; border: 1.5px solid #ecd9a0; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
  .unseated-panel h4 { font-size: 0.82rem; color: #7a5c00; margin-bottom: 8px; }
  .unseated-panel .chip { cursor: pointer; }
  .unseated-panel .chip:hover, .unseated-panel .chip.selected { border-color: var(--accent); background: #fdf3d8; }
  .ka-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }

  .lookup-box { max-width: 540px; margin: 0 auto; }
  .lookup-input-wrap { position: relative; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(15,31,61,0.12); overflow: hidden; }
  .lookup-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.1rem; pointer-events: none; }
  .search-input { width: 100%; padding: 17px 18px 17px 50px; border: none; font-size: 1rem; background: transparent; border-radius: 0; }
  .search-results { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .result-card { background: white; border-radius: 12px; padding: 15px 20px; box-shadow: 0 2px 12px rgba(15,31,61,0.08); border-left: 4px solid var(--blue); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .result-card.withdrawn { border-left-color: var(--red); }
  .result-card.special { border-left-color: var(--purple); }
  .result-name { font-family: 'DM Serif Display', serif; font-size: 1.08rem; color: var(--navy); text-transform: uppercase; }
  .result-first { font-size: 0.78rem; color: var(--muted); }
  .result-details { font-size: 0.79rem; color: var(--muted); margin-top: 3px; }

  .print-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .print-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 2px 10px rgba(15,31,61,0.07); }
  .print-card h3 { font-family: 'DM Serif Display', serif; font-size: 1.05rem; color: var(--navy); margin-bottom: 4px; }
  .print-card p { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }

  .help-item { background: white; border-radius: 12px; box-shadow: 0 2px 10px rgba(15,31,61,0.07); margin-bottom: 10px; overflow: hidden; }
  .help-item > button { width: 100%; text-align: left; background: none; border: none; padding: 15px 20px; font-size: 0.95rem; font-weight: 700; color: var(--navy); display: flex; justify-content: space-between; align-items: center; }
  .help-item > button:hover { background: #f5f8f6; }
  .help-body { display: none; padding: 0 20px 18px; font-size: 0.86rem; line-height: 1.65; }
  .help-item.open .help-body { display: block; }
  .help-body ol { margin: 8px 0 8px 22px; }
  .help-body li { margin-bottom: 5px; }
  .help-body .tip { background: #e6f4ec; border-left: 4px solid var(--green); padding: 8px 12px; border-radius: 6px; margin-top: 8px; font-size: 0.8rem; }

  .modal-back { display: none; position: fixed; inset: 0; background: rgba(10,25,15,0.55); z-index: 100; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow: auto; }
  .modal-back.open { display: flex; }
  .modal { background: white; border-radius: 14px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: fadeIn 0.18s ease; }
  .modal.wide { max-width: 760px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .modal-head { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-family: 'DM Serif Display', serif; color: var(--navy); font-size: 1.15rem; }
  .modal-head button { background: none; border: none; font-size: 1.3rem; color: var(--muted); }
  .modal-body { padding: 18px 22px; }
  .modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .form-row { margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row input, .form-row select { width: 100%; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy); color: white; padding: 11px 22px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.3); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 200; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  @media (max-width: 720px) {
    header { padding: 12px 14px 0; }
    main { padding: 16px 14px 60px; }
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ---- customisation (Settings tab, room editor, blocked seats) ---- */
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-brand img { height: 40px; max-width: 150px; object-fit: contain; background: white; border-radius: 6px; padding: 3px; }
  textarea { width: 100%; resize: vertical; }
  .t-extra { font-size: 0.72rem; color: var(--purple); margin-top: 2px; }
  .rc-order { margin-left: auto; display: flex; gap: 4px; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .seat-cell.blocked { background: repeating-linear-gradient(45deg, #eef0f4, #eef0f4 5px, #e2e6ee 5px, #e2e6ee 10px); border-style: dashed; cursor: default !important; }
  .seat-cell.blocked.aisle { background: transparent; border-color: transparent; }
  .mask-wrap { overflow: auto; max-height: 320px; margin-top: 6px; }
  .mask { border-collapse: separate; border-spacing: 2px; }
  .mask th { font-size: 0.6rem; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; padding: 0 3px; }
  .mask th:hover { color: var(--navy); }
  .mask td.m { width: 16px; min-width: 16px; height: 14px; border: 1px solid var(--border); border-radius: 3px; background: #fafbff; cursor: pointer; }
  .mask td.m:hover { border-color: var(--blue); }
  .mask td.m.aisle, .m-key.aisle { background: #fff; border: 1px dashed #c3c9d6; }
  .mask td.m.unusable, .m-key.unusable { background: #8a93a6; border-color: #8a93a6; }
  .m-key { display: inline-block; width: 12px; height: 10px; border-radius: 2px; vertical-align: middle; margin-left: 6px; }
  .set-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 2px 10px rgba(15,31,61,0.07); margin-bottom: 16px; }
  .set-card h3 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--navy); margin-bottom: 6px; }
  .set-card > p.muted { margin-bottom: 12px; }
  .set-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .set-table th { text-align: left; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 6px; }
  .set-table td { padding: 4px 6px; vertical-align: middle; }
  .set-table input[type=text], .set-table select { width: 100%; }
  .set-table input[type=color], .set-card input[type=color] { width: 46px; height: 34px; padding: 2px; }
  .set-actions { white-space: nowrap; text-align: right; }
  .set-actions .btn { margin-left: 3px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  label.check { text-transform: none; letter-spacing: 0; font-size: 0.85rem; color: var(--text); font-weight: 400; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  label.check input { padding: 0; width: auto; margin: 0; }
  .logo-preview { height: 40px; vertical-align: middle; border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
  .settings-bar { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 16px; margin: 0 -16px; background: var(--light); border-top: 1px solid var(--border); box-shadow: 0 -4px 12px rgba(15,31,61,0.06); }
  .settings-bar > .muted { margin-right: auto; visibility: hidden; }
  .settings-bar.dirty > .muted { visibility: visible; color: var(--accent); font-weight: 700; }
  .warn-box { background: #fdf3d8; border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; }
  .ka-reason { font-size: 0.76rem; font-style: italic; }
  @media (max-width: 640px) { .set-table thead { display: none; } .set-table tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border-bottom: 1px solid var(--border); padding: 6px 0; } }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-brand">
      <img id="brandLogo" alt="" style="display:none">
      <div class="header-title">
        <h1>Exam Seating Manager</h1>
        <p id="brandSub">Crusoe College &middot; Shared seating &amp; supervision plans</p>
      </div>
    </div>
    <div class="header-right">
      <span class="session-badge" id="sessionBadge">No session</span>
      <span class="sync-pill local" id="syncPill"><span class="sync-dot"></span><span id="syncText">Local</span></span>
      <button class="hbtn gold" id="editorBtn" onclick="toggleEditor()">Editor sign in</button>
    </div>
  </div>
  <nav id="mainNav">
    <button data-tab="sessions" class="active" onclick="go('sessions')">Exam Sessions</button>
    <button data-tab="students" onclick="go('students')">Students</button>
    <button data-tab="rooms" class="editor-only" onclick="go('rooms')">Rooms &amp; Layout</button>
    <button data-tab="seating" onclick="go('seating')">Seating Plan</button>
    <button data-tab="lookup" onclick="go('lookup')">Lookup</button>
    <button data-tab="print" onclick="go('print')">Print</button>
    <button data-tab="help" onclick="go('help')">How-to Guides</button>
    <button data-tab="settings" class="editor-only" onclick="go('settings')">Settings</button>
  </nav>
</header>

<main id="main"></main>

<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox">
    <div class="modal-head"><h3 id="modalTitle"></h3><button onclick="closeModal()">&#10005;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">

<script>
'use strict';
/* ================================================================
   CONFIG — the only section a maintainer ever edits.
   API_URL: paste the Google Apps Script web-app URL here after
   completing SETUP_GUIDE.md. Leave it blank to run in local mode
   (data stays in this browser only — good for testing).
   PRIVACY: never set API_URL in a copy hosted on a PUBLIC website
   (such as the compassaddons GitHub Pages site). Reading from the
   backend needs no password, so anyone who opens that page could
   read every student's name. Host a shared-mode copy privately.
   ================================================================ */
var CONFIG = {
  API_URL: '',
  LOCAL_EDITOR_PASSWORD: 'crusoe2026',
  STORAGE_KEY: 'crusoe_exam_seating_v1'
};

/* ============================ STATE ============================ */
var DB = null;
var editor = false;
var editorPassword = '';
var activeTab = 'sessions';
var saveTimer = null;
var selectedSeat = null;
var seatingRoomFilter = 'all';
var studentFilter = { q: '', status: 'all' };
var importRows = null;
var settingsDraft = null;   // working copy while the Settings tab is open

var backendHasSettings = true;   // false when the Apps Script backend predates the Settings tab

/* ====================== DEFAULT SETTINGS ======================
   Everything a coordinator can change on the Settings tab. These
   defaults reproduce the app's original behaviour exactly, so data
   saved before settings existed looks and seats the same.
   Status ids for the four built-in statuses are the original
   strings ('Completing' etc.) so existing student rows need no
   rewriting; renaming a status only changes its label.
   ================================================================ */
var DEFAULT_ACCENT = '#0d5c2e';
var DEFAULT_CONFIG = {
  school: { name: 'Crusoe College', tagline: 'Shared seating & supervision plans', accent: DEFAULT_ACCENT, logo: '' },
  purposes: [
    { id: 'main', label: 'Main exam room', layout: 'seated', printTitle: '' },
    { id: 'special', label: 'Special provisions', layout: 'list', printTitle: 'Special Exam Arrangements',
      printCard: 'Special exam arrangements', printDesc: 'All special-provision students and where they sit.', printBtn: 'Print arrangements' },
    { id: 'withdrawn', label: 'Withdrawn / exemptions', layout: 'list', printTitle: 'Withdrawals and Exemptions',
      printCard: 'Withdrawals & exemptions', printDesc: 'Students not completing this exam, for the front office.', printBtn: 'Print list' }
  ],
  statuses: [
    { id: 'Completing', label: 'Completing', purpose: 'main', color: '#1a5c22', keywords: '' },
    { id: 'Special Provision', label: 'Special Provision', purpose: 'special', color: '#5a3a8a', keywords: 'special' },
    { id: 'Withdrawn', label: 'Withdrawn', purpose: 'withdrawn', color: '#b83232', keywords: 'withdraw' },
    { id: 'Exemption', label: 'Exemption', purpose: 'withdrawn', color: '#b83232', keywords: 'exempt' }
  ],
  seating: { sortBy: 'surname', pattern: 'all', rowDir: 'front', seatDir: 'ltr', near: 'cross' },
  print: { gridOrientation: 'landscape', listOrientation: 'portrait',
           masterCols: ['student', 'klass', 'status', 'location'], listCols: ['student', 'klass', 'status', 'room'],
           showSupervisor: true, showTimes: true, instructions: '' }
};
var DEFAULT_ROOM_LAYOUT = { rowLabels: 'number', rowFrom: 'start', seatLabels: 'number', seatFrom: 'start', blocked: {}, supervisor: '' };

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function isPlainObj(o) { return o && typeof o === 'object' && !Array.isArray(o); }
/* Fill any key missing from target with a copy of the default. Never overwrites. */
function fillDefaults(target, defaults) {
  Object.keys(defaults).forEach(function (k) {
    if (target[k] === undefined || target[k] === null) target[k] = clone(defaults[k]);
    else if (isPlainObj(target[k]) && isPlainObj(defaults[k])) fillDefaults(target[k], defaults[k]);
  });
  return target;
}
function isHex(c) { return /^#[0-9a-f]{6}$/i.test(String(c || '')); }
function safeJSON(str, fallback) { if (!str) return fallback; try { return JSON.parse(str); } catch (e) { return fallback; } }

/* ---- settings lookups ---- */
function cfg() { return DB.config; }
function statusList() { return cfg().statuses; }
function statusById(id) { return statusList().find(function (x) { return x.id === id; }) || null; }
function statusLabel(id) { var x = statusById(id); return x ? x.label : String(id || ''); }
function defaultStatusId() { return statusList()[0].id; }
function purposeById(id) {
  return cfg().purposes.find(function (p) { return p.id === id; }) || { id: id, label: String(id || 'Unknown'), layout: 'list', printTitle: '' };
}
function purposeLabel(id) { return purposeById(id).label; }
function statusPurpose(id) { var x = statusById(id); return x ? x.purpose : null; }
/* True when students with this status are placed in a seat grid (not on a list). */
function isSeatedStatus(id) { var p = statusPurpose(id); return !!p && purposeById(p).layout === 'seated'; }
function statusColor(id) { var x = statusById(id); return x && isHex(x.color) ? x.color : '#6b7a99'; }
function hexToRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function pillHTML(id) {
  var c = statusColor(id), rgb = hexToRgb(c);
  return '<span class="pill" style="background:rgba(' + rgb.join(',') + ',0.12);color:' + c + '">' + esc(statusLabel(id)) + '</span>';
}

/* ---- room labels: positions are stored as numbers; labels are display only ---- */
function letters(n) { var s = ''; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function lineLabel(n, total, style, from) {
  var k = from === 'end' ? total - n + 1 : n;
  return style === 'letter' ? letters(k) : String(k);
}
function rowLabel(r, n) { var L = r.layout || DEFAULT_ROOM_LAYOUT; return lineLabel(n, r.rows, L.rowLabels, L.rowFrom); }
function seatLabel(r, n) { var L = r.layout || DEFAULT_ROOM_LAYOUT; return lineLabel(n, r.seatsPerRow, L.seatLabels, L.seatFrom); }
function seatBlocked(r, row, seat) { return !!(r.layout && r.layout.blocked && r.layout.blocked[row + '_' + seat]); }
function usableSeats(r) {
  var n = 0;
  for (var row = 1; row <= r.rows; row++) for (var seat = 1; seat <= r.seatsPerRow; seat++) if (!seatBlocked(r, row, seat)) n++;
  return n;
}

/* ============================ MIGRATION ============================
   Runs on every load and is idempotent: brings data saved by any
   earlier version up to the current shape without changing what it
   means. Missing settings take the original behaviour.
   ================================================================ */
function migrateConfig(c) {
  c = isPlainObj(c) ? c : {};
  fillDefaults(c, DEFAULT_CONFIG);
  if (!Array.isArray(c.statuses) || !c.statuses.length) c.statuses = clone(DEFAULT_CONFIG.statuses);
  if (!Array.isArray(c.purposes) || !c.purposes.length) c.purposes = clone(DEFAULT_CONFIG.purposes);
  if (!Array.isArray(c.print.masterCols)) c.print.masterCols = clone(DEFAULT_CONFIG.print.masterCols);
  if (!Array.isArray(c.print.listCols)) c.print.listCols = clone(DEFAULT_CONFIG.print.listCols);
  if (!isHex(c.school.accent)) c.school.accent = DEFAULT_ACCENT;
  return c;
}
function migrateRoom(r) {
  r.layout = isPlainObj(r.layout) ? r.layout : {};
  fillDefaults(r.layout, DEFAULT_ROOM_LAYOUT);
  if (!isPlainObj(r.layout.blocked)) r.layout.blocked = {};
  // List rooms never had a size; give one in case their type becomes a seat grid.
  if (!(Number(r.rows) > 0)) r.rows = 12;
  if (!(Number(r.seatsPerRow) > 0)) r.seatsPerRow = 18;
  return r;
}
function migrateSession(s) {
  s.settings = isPlainObj(s.settings) ? s.settings : {};
  if (!Array.isArray(s.settings.keepApart)) s.settings.keepApart = [];
  // Older sessions get the original rules, not whatever the school default is now.
  fillDefaults(s.settings, DEFAULT_CONFIG.seating);
  fillDefaults(s.settings, { shuffleSeed: 1, startTime: '', finishTime: '' });
  (s.rooms || []).forEach(migrateRoom);
  (s.students || []).forEach(function (st) {
    if (st.arrangements == null) st.arrangements = '';
    if (st.notes == null) st.notes = '';
  });
  normaliseSession(s);
  return s;
}
/* Keep rooms and placements consistent with the current room-purpose settings. */
function normaliseSession(s) {
  if (!DB || !DB.config) return;
  (s.rooms || []).forEach(function (r) { r.kind = purposeById(r.purpose).layout === 'seated' ? 'seated' : 'list'; });
  (s.students || []).forEach(function (st) {
    if (!st.roomId) return;
    var r = s.rooms.find(function (x) { return x.id === st.roomId; });
    if (!r) { st.roomId = null; st.row = null; st.seat = null; return; }
    if (r.kind !== 'seated' && st.row) { st.row = null; st.seat = null; }
  });
}
function migrateDB(db) {
  db.config = migrateConfig(db.config);
  db.sessions = db.sessions || [];
  db.templates = db.templates || [];
  db.templates.forEach(function (t) { (t.rooms || []).forEach(migrateRoom); });
  var prev = DB; DB = db;           // helpers read DB.config
  db.sessions.forEach(migrateSession);
  DB = prev;
  return db;
}
/* The per-session settings that travel in the Sessions tab's settingsJson column.
   Keep-apart pairs travel separately in the Separations tab. */
function sessionSettingsForSave(s) {
  var o = {};
  Object.keys(s.settings).forEach(function (k) { if (k !== 'keepApart') o[k] = s.settings[k]; });
  return o;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function byName(a, b) { return (a.last + a.first).localeCompare(b.last + b.first); }
function session() { return DB.sessions.find(function (s) { return s.id === DB.activeSessionId; }) || null; }
function remote() { return !!CONFIG.API_URL; }

function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.className = ''; }, 3200);
}

/* ==================== STORAGE & SYNC LAYER ==================== */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

function setSync(state, text) {
  document.getElementById('syncPill').className = 'sync-pill ' + state;
  document.getElementById('syncText').textContent = text;
}

async function apiPost(payload) {
  var res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('Network error ' + res.status);
  return await res.json();
}

async function apiGet(params) {
  var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  var res = await fetch(CONFIG.API_URL + '?' + qs);
  if (!res.ok) throw new Error('Network error ' + res.status);
  return await res.json();
}

/* ---- mapping between the app model and the backend sheet rows ---- */
function roomToRow(sid, r, i) {
  return { sessionId: sid, roomId: r.id, name: r.name, layoutType: r.kind + ':' + r.purpose,
           rows: r.rows || '', seatsPerRow: r.seatsPerRow || '', color: '', sortOrder: i,
           layoutJson: JSON.stringify(r.layout || {}) };
}
function rowToRoom(x) {
  var lt = String(x.layoutType || 'seated:main').split(':');
  return migrateRoom({ id: String(x.roomId), name: String(x.name || ''), kind: lt[0] === 'list' ? 'list' : 'seated',
           purpose: lt[1] || 'main', rows: Number(x.rows) || 12, seatsPerRow: Number(x.seatsPerRow) || 18,
           layout: safeJSON(x.layoutJson, {}) });
}
function studentToRow(sid, st) {
  return { sessionId: sid, studentId: st.id, firstName: st.first, lastName: st.last, homegroup: st.klass || '',
           status: st.status, room: st.roomId || '', row: st.row || '', seat: st.seat || '',
           arrangements: st.arrangements || '', notes: st.notes || '' };
}
function rowToStudent(x) {
  return { id: String(x.studentId), first: String(x.firstName || ''), last: String(x.lastName || ''),
           klass: String(x.homegroup || ''), status: String(x.status || 'Completing'),
           roomId: String(x.room || '') || null, row: Number(x.row) || null, seat: Number(x.seat) || null,
           arrangements: String(x.arrangements || ''), notes: String(x.notes || '') };
}
function sessionShell(s) {
  var settings = safeJSON(s.settingsJson, {});
  if (!isPlainObj(settings)) settings = {};
  settings.keepApart = [];
  return { id: s.sessionId, name: s.name, group: s.yearLevels || '', date: s.examDate || '',
           version: Number(s.version) || 1, loaded: false, rooms: [], students: [], settings: settings };
}

/* Fetch the school-wide settings. An old backend has no getSettings action:
   fall back to defaults and say so on the Settings tab instead of failing. */
async function fetchSettings() {
  var out;
  try { out = await apiGet({ action: 'getSettings' }); }
  catch (e) { out = { ok: false }; }
  if (!out.ok) { backendHasSettings = false; DB.configVersion = 0; DB.config = migrateConfig({}); return; }
  backendHasSettings = true;
  DB.configVersion = Number(out.version) || 0;
  DB.config = migrateConfig(safeJSON(out.valueJson, {}));
}

async function loadDB() {
  if (remote()) {
    setSync('saving', 'Loading');
    try {
      var both = await Promise.all([apiGet({ action: 'listSessions' }), apiGet({ action: 'listTemplates' })]);
      var ls = both[0], lt = both[1];
      if (!ls.ok) throw new Error(ls.error || 'load failed');
      DB = {
        version: 1,
        sessions: (ls.sessions || []).map(sessionShell),
        templates: (lt.ok ? lt.templates : []).map(function (t) { return { id: t.templateId, name: t.name, rooms: t.rooms || [] }; }),
        activeSessionId: lsGet(CONFIG.STORAGE_KEY + '_active')
      };
      await fetchSettings();
      migrateDB(DB);
      if (!DB.sessions.find(function (s) { return s.id === DB.activeSessionId; })) {
        DB.activeSessionId = DB.sessions.length ? DB.sessions[0].id : null;
      }
      if (DB.activeSessionId) await ensureLoaded(DB.activeSessionId);
      setSync('ok', 'Synced');
      return;
    } catch (e) {
      setSync('err', 'Offline');
      toast('Could not reach the shared data: ' + e.message + ' — check your internet, then refresh', true);
      DB = migrateDB({ version: 1, sessions: [], templates: [], activeSessionId: null });
      return;
    }
  }
  var raw = lsGet(CONFIG.STORAGE_KEY);
  if (raw) { try { DB = JSON.parse(raw); } catch (e) { DB = null; } }
  if (!DB || !DB.sessions) DB = buildSeedDB();
  migrateDB(DB);
  setSync('local', 'Local mode');
}

async function ensureLoaded(id) {
  var s = DB.sessions.find(function (x) { return x.id === id; });
  if (!s || s.loaded || !remote()) return;
  var out = await apiGet({ action: 'getSession', sessionId: id });
  if (!out.ok) throw new Error(out.error || 'session load failed');
  s.rooms = (out.rooms || []).sort(function (a, b) { return Number(a.sortOrder) - Number(b.sortOrder); }).map(rowToRoom);
  s.students = (out.students || []).map(rowToStudent);
  var saved = safeJSON(out.session.settingsJson, null);
  if (isPlainObj(saved)) Object.keys(saved).forEach(function (k) { if (k !== 'keepApart') s.settings[k] = saved[k]; });
  s.settings.keepApart = (out.separations || []).map(function (p) {
    var pair = [String(p.studentIdA), String(p.studentIdB)];
    if (p.reason) pair.push(String(p.reason));
    return pair;
  });
  s.version = Number(out.session.version) || s.version;
  s.loaded = true;
  migrateSession(s);
}

/* Load every session (remote mode loads lazily). Used before checks that
   must see all data, such as deleting a status that might still be in use. */
async function ensureAllLoaded() {
  for (var i = 0; i < DB.sessions.length; i++) await ensureLoaded(DB.sessions[i].id);
}

function markDirty() {
  if (!editor) return;
  if (!remote()) { lsSet(CONFIG.STORAGE_KEY, JSON.stringify(DB)); return; }
  setSync('saving', 'Saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { var s = session(); if (s) saveSessionNow(s); }, 1200);
}

async function saveSessionNow(s) {
  try {
    var out = await apiPost({
      action: 'saveSessionData', password: editorPassword,
      sessionId: s.id, version: s.version,
      settingsJson: JSON.stringify(sessionSettingsForSave(s)),
      students: s.students.map(function (st) { return studentToRow(s.id, st); }),
      rooms: s.rooms.map(function (r, i) { return roomToRow(s.id, r, i); }),
      separations: s.settings.keepApart.map(function (p) { return { sessionId: s.id, studentIdA: p[0], studentIdB: p[1], reason: p[2] || '' }; })
    });
    if (out.ok) { s.version = out.version; setSync('ok', 'Synced'); return true; }
    if (out.error === 'VERSION_CONFLICT') { setSync('err', 'Conflict'); conflictModal(s); return false; }
    throw new Error(out.error || 'Save rejected');
  } catch (e) {
    setSync('err', 'Save failed');
    toast('Save failed: ' + e.message + ' — check your connection and make the change again', true);
    return false;
  }
}

/* Save the school-wide settings. Same optimistic-concurrency rule as sessions:
   send the version we loaded; a stale save is refused, never overwritten. */
async function saveConfigNow() {
  if (!editor) return false;
  if (!remote()) { lsSet(CONFIG.STORAGE_KEY, JSON.stringify(DB)); return true; }
  if (!backendHasSettings) {
    toast('Settings cannot be shared yet: the Google Sheet backend needs a one-off update (see SETUP_GUIDE.md, "Updating an existing install").', true);
    return false;
  }
  setSync('saving', 'Saving');
  try {
    var out = await apiPost({ action: 'saveSettings', password: editorPassword, version: DB.configVersion, valueJson: JSON.stringify(DB.config) });
    if (out.ok) { DB.configVersion = out.version; setSync('ok', 'Synced'); return true; }
    if (out.error === 'VERSION_CONFLICT') { setSync('err', 'Conflict'); settingsConflictModal(); return false; }
    if (out.error === 'SETTINGS_TOO_LARGE') throw new Error('the settings are too big to store — try a smaller logo');
    throw new Error(out.error || 'Save rejected');
  } catch (e) {
    setSync('err', 'Save failed');
    toast('Settings not saved: ' + e.message + ' — check your connection and try again', true);
    return false;
  }
}

function settingsConflictModal() {
  openModal('Someone else changed the settings',
    '<p>Another editor saved the school settings after you loaded them. To protect their work, your settings changes were <b>not</b> saved.</p><p style="margin-top:8px">Reload to get their version, then make your change again.</p>',
    [{ label: 'Reload latest', cls: 'btn', fn: async function () {
      try { await fetchSettings(); DB.sessions.forEach(normaliseSession); setSync('ok', 'Synced'); }
      catch (e) { toast('Reload failed: ' + e.message, true); }
      settingsDraft = null; applyBranding(); closeModal(); render();
    } }]);
}

function conflictModal(s) {
  openModal('Someone else saved first',
    '<p>Another editor saved changes to <b>' + esc(s.name) + '</b> after you loaded it. To protect their work, your last change was <b>not</b> saved.</p><p style="margin-top:8px">Reload to get the latest plan, then redo your change.</p>',
    [{ label: 'Reload latest', cls: 'btn', fn: async function () {
      s.loaded = false;
      try { await ensureLoaded(s.id); setSync('ok', 'Synced'); }
      catch (e) { toast('Reload failed: ' + e.message, true); }
      closeModal(); render();
    } }]);
}

/* ========================= EDITOR MODE ========================= */
function toggleEditor() {
  if (editor) {
    editor = false; editorPassword = ''; selectedSeat = null;
    document.body.classList.remove('is-editor');
    document.getElementById('editorBtn').textContent = 'Editor sign in';
    settingsDraft = null;
    if (activeTab === 'rooms' || activeTab === 'settings') activeTab = 'seating';
    render();
    toast('Now in view-only mode');
    return;
  }
  openModal('Editor sign in',
    '<p class="muted" style="margin-bottom:12px">Editing is limited to exam coordinators. Enter the editor password to unlock changes — everyone else can view and print without signing in.</p>' +
    '<div class="form-row"><label>Editor password</label><input type="password" id="pwInput" autocomplete="off"></div>',
    [{ label: 'Sign in', cls: 'btn', fn: attemptSignIn }]);
  setTimeout(function () {
    var el = document.getElementById('pwInput');
    if (el) { el.focus(); el.onkeydown = function (e) { if (e.key === 'Enter') attemptSignIn(); }; }
  }, 60);
}

async function attemptSignIn() {
  var el = document.getElementById('pwInput');
  var pw = el ? el.value : '';
  if (remote()) {
    try {
      var out = await apiPost({ action: 'checkPassword', password: pw });
      if (!out.ok) { toast('Wrong password', true); return; }
    } catch (e) { toast('Could not verify — check your connection', true); return; }
  } else if (pw !== CONFIG.LOCAL_EDITOR_PASSWORD) {
    toast('Wrong password', true); return;
  }
  editorPassword = pw; editor = true;
  document.body.classList.add('is-editor');
  document.getElementById('editorBtn').textContent = 'Sign out (editing)';
  closeModal(); render();
  toast('Editing unlocked');
}

/* =========================== MODAL ============================ */
function openModal(title, bodyHTML, buttons, wide) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalBox').className = wide ? 'modal wide' : 'modal';
  var foot = document.getElementById('modalFoot');
  foot.innerHTML = '';
  var cancel = document.createElement('button');
  cancel.className = 'btn secondary'; cancel.textContent = 'Cancel'; cancel.onclick = closeModal;
  foot.appendChild(cancel);
  (buttons || []).forEach(function (b) {
    var btn = document.createElement('button');
    btn.className = b.cls || 'btn'; btn.textContent = b.label; btn.onclick = b.fn;
    foot.appendChild(btn);
  });
  document.getElementById('modalBack').classList.add('open');
}
function closeModal() { document.getElementById('modalBack').classList.remove('open'); }

/* ========================= NAVIGATION ========================= */
var EDITOR_TABS = { rooms: 1, settings: 1 };
function go(tab) {
  if (EDITOR_TABS[tab] && !editor) return;
  activeTab = tab;
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
  render();
  window.scrollTo(0, 0);
}

function render() {
  var s = session();
  document.getElementById('sessionBadge').textContent = s ? s.name : 'No session';
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === activeTab); });
  if (EDITOR_TABS[activeTab] && !editor) activeTab = 'seating';
  var views = { sessions: viewSessions, students: viewStudents, rooms: viewRooms, seating: viewSeating, lookup: viewLookup, print: viewPrint, help: viewHelp, settings: viewSettings };
  document.getElementById('main').innerHTML = (views[activeTab] || viewSessions)();
  if (activeTab === 'lookup') { var el = document.getElementById('searchInput'); if (el) el.focus(); }
}

function noSessionMsg() {
  return '<div class="empty-msg">No exam session is open. Go to <b>Exam Sessions</b> and open or create one.</div>';
}


/* ====================== VIEW: SESSIONS ======================== */
function viewSessions() {
  var cards = DB.sessions.map(function (s) {
    var isLoaded = s.loaded || !remote();
    var total = isLoaded ? s.students.length : '—';
    var seated = isLoaded ? s.students.filter(function (st) { return st.roomId && st.row; }).length : '—';
    var rooms = isLoaded ? s.rooms.length : '—';
    return '<div class="session-card ' + (s.id === DB.activeSessionId ? 'active' : '') + '" onclick="openSession(\'' + s.id + '\')">' +
      '<h3>' + esc(s.name) + '</h3>' +
      '<div class="sc-sub">' + esc(s.group || '') + (s.date ? ' &middot; ' + esc(s.date) : '') + '</div>' +
      '<div class="sc-stats"><span><b>' + total + '</b>Students</span><span><b>' + seated + '</b>Seated</span><span><b>' + rooms + '</b>Rooms</span></div>' +
      '<div class="sc-actions editor-only" onclick="event.stopPropagation()">' +
        '<button class="btn small secondary" onclick="editSessionModal(\'' + s.id + '\')">Edit</button>' +
        '<button class="btn small secondary" onclick="duplicateSession(\'' + s.id + '\')">Duplicate</button>' +
        '<button class="btn small danger" onclick="deleteSession(\'' + s.id + '\')">Delete</button>' +
      '</div></div>';
  }).join('');
  return '<div class="view-note">You are in <b>view-only mode</b> — browse, search and print everything you need. Nothing you click can change the data. Coordinators use "Editor sign in" (top right) to make changes.</div>' +
    '<div class="section-head"><div><h2>Exam Sessions</h2><p>Each session is one exam event with its own students, rooms and seating plan. Click a session to open it.</p></div>' +
    '<div class="toolbar"><button class="btn editor-only" onclick="newSessionModal()">+ New session</button>' +

async function openSession(id) {
  DB.activeSessionId = id;
  lsSet(CONFIG.STORAGE_KEY + '_active', id);
  if (!remote()) { if (editor) markDirty(); }
  else {
    try { setSync('saving', 'Loading'); await ensureLoaded(id); setSync('ok', 'Synced'); }

function timeFields(s) {

function editSessionModal(id) {

async function duplicateSession(id) {
  if (!editor) return;
  var s = DB.sessions.find(function (x) { return x.id === id; });
  if (remote()) {
    try {
      await ensureLoaded(id);
      var out = await apiPost({ action: 'createSession', password: editorPassword, name: s.name + ' (copy)', examDate: s.date, yearLevels: s.group });
      if (!out.ok) throw new Error(out.error || 'create failed');
      var copy = JSON.parse(JSON.stringify(s));
      copy.id = out.session.sessionId; copy.name = s.name + ' (copy)';
      copy.version = Number(out.session.version) || 1; copy.loaded = true;
      DB.sessions.push(copy);
      await saveSessionNow(copy);
    } catch (e) { toast('Duplicate failed: ' + e.message, true); return; }
  } else {
    var c = JSON.parse(JSON.stringify(s));
    c.id = uid(); c.name = s.name + ' (copy)';
    DB.sessions.push(c); markDirty();
  }
  render();
  toast('Session duplicated');
}

function deleteSession(id) {
  if (!editor) return;
  var s = DB.sessions.find(function (x) { return x.id === id; });
  openModal('Delete session?',
    '<p>This permanently removes <b>' + esc(s.name) + '</b> including its students and seating plan. This cannot be undone.</p>',
    [{ label: 'Delete permanently', cls: 'btn danger', fn: async function () {

        try {
          var out = await apiPost({ action: 'deleteSession', password: editorPassword, sessionId: id });

/* ====================== VIEW: STUDENTS ======================== */
function roomName(s, roomId) { var r = s.rooms.find(function (x) { return x.id === roomId; }); return r ? r.name : '—'; }
/* CSS class for a status's room purpose: built-in purposes are styled (special, withdrawn). */
function pillClass(status) { return statusPurpose(status) || 'none'; }
/* "GYM · Row 3 · Seat 7" with the room's own row/seat labels. */
function locText(s, st, empty) {
  var r = s.rooms.find(function (x) { return x.id === st.roomId; });
  if (!r) return empty === undefined ? '—' : empty;
  if (st.row) return esc(r.name) + ' &middot; Row ' + esc(rowLabel(r, st.row)) + ' &middot; Seat ' + esc(seatLabel(r, st.seat));
  return esc(r.name);
}

/* THE single place that decides placement from status (see CLAUDE.md).
   Clears any seat. A status whose room purpose is a seat grid waits for
   Generate seating or a manual move; a list purpose goes straight to the
   first room with that purpose. Rules come from Settings → Statuses. */
function routeStudent(s, st) {
  st.row = null; st.seat = null; st.roomId = null;
  var pid = statusPurpose(st.status);
  if (!pid || purposeById(pid).layout === 'seated') return;
  var r = s.rooms.find(function (x) { return x.purpose === pid; });
  if (r) st.roomId = r.id;
}

function deleteStudent(id) {
  if (!editor) return;
  var s = session();
  var st = s.students.find(function (x) { return x.id === id; });
  openModal('Remove student?', '<p>Remove <b>' + esc(st.first) + ' ' + esc(st.last) + '</b> from this session?</p>',
    [{ label: 'Remove', cls: 'btn danger', fn: function () {
      s.students = s.students.filter(function (x) { return x.id !== id; });
      s.settings.keepApart = s.settings.keepApart.filter(function (p) { return p[0] !== id && p[1] !== id; });
      markDirty(); closeModal(); render();
    } }]);
}

function exportCSV() {
  if (!editor) return;
  var s = session();
  var lines = [['First', 'Surname', 'Class', 'Status', 'Room', 'Row', 'Seat', 'Arrangements', 'Notes'].join(',')];
  s.students.slice().sort(byName).forEach(function (st) {
    var r = s.rooms.find(function (x) { return x.id === st.roomId; });
    lines.push([st.first, st.last, st.klass || '', statusLabel(st.status), roomName(s, st.roomId),
                st.row && r ? rowLabel(r, st.row) : '', st.seat && r ? seatLabel(r, st.seat) : '', st.arrangements || '', st.notes || '']
      .map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','));
  });
  var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = s.name.replace(/[^a-z0-9]+/gi, '_') + '_students.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* ==================== IMPORT (Excel / CSV) ==================== */
function startImport() {
  if (!editor) return;
  var inp = document.getElementById('fileInput');
  inp.value = '';
  inp.onchange = function () { if (inp.files[0]) readImportFile(inp.files[0]); };
  inp.click();
}

function readImportFile(file) {
  if (typeof XLSX === 'undefined') {
    toast('The spreadsheet reader did not load. Check your internet connection and refresh the page.', true);
    return;
  }
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var wb = XLSX.read(e.target.result, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      var cleaned = rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
      if (cleaned.length < 2) { toast('That file looks empty', true); return; }
      importRows = cleaned;
      showMappingModal();
    } catch (err) { toast('Could not read that file: ' + err.message, true); }
  };
  reader.readAsArrayBuffer(file);
}

function guessCol(headers, keys) {
  for (var i = 0; i < headers.length; i++) {
    var h = String(headers[i]).toLowerCase();
    for (var j = 0; j < keys.length; j++) if (h.indexOf(keys[j]) >= 0) return i;
  }
  return -1;
}

function showMappingModal() {
  var headers = importRows[0].map(function (h) { return String(h); });
  function opts(i) {
    return '<option value="-1">— not in file —</option>' + headers.map(function (h, j) {
      return '<option value="' + j + '"' + (j === i ? ' selected' : '') + '>' + esc(h) + '</option>';
    }).join('');
  }
  var preview = importRows.slice(1, 4).map(function (r) {
    return '<tr>' + r.slice(0, 6).map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
  }).join('');
  openModal('Match your columns',
    '<p class="muted" style="margin-bottom:12px">Found <b>' + (importRows.length - 1) + '</b> rows. Tell the app which column holds what — it has guessed where it can.</p>' +
    '<div class="form-grid"><div class="form-row"><label>First name column</label><select id="m_first">' + opts(guessCol(headers, ['first', 'given'])) + '</select></div>' +
    '<div class="form-row"><label>Surname column</label><select id="m_last">' + opts(guessCol(headers, ['surname', 'last', 'family'])) + '</select></div></div>' +
    '<div class="form-grid"><div class="form-row"><label>Class / homegroup</label><select id="m_klass">' + opts(guessCol(headers, ['class', 'homegroup', 'home group', 'form', 'hg'])) + '</select></div>' +
    '<div class="form-row"><label>Status (optional)</label><select id="m_status">' + opts(guessCol(headers, ['status', 'provision'])) + '</select></div></div>' +
    '<div class="form-grid"><div class="form-row"><label>Arrangements (optional)</label><select id="m_arr">' + opts(guessCol(headers, ['arrangement', 'adjustment'])) + '</select></div>' +
    '<div class="form-row"><label>Notes (optional)</label><select id="m_notes">' + opts(guessCol(headers, ['note', 'comment'])) + '</select></div></div>' +
    '<div class="form-row"><label>How to add these students</label><select id="m_mode"><option value="replace">Replace the current student list</option><option value="append">Add to the current student list</option></select></div>' +
    '<label>File preview (first rows)</label><div class="table-wrap" style="max-height:130px"><table class="data"><tbody>' + preview + '</tbody></table></div>',
    [{ label: 'Import students', cls: 'btn', fn: doImport }], true);
}

/* Match a spreadsheet status cell to a status: its label, or any of its
   import keywords (Settings → Statuses). The first status is the default. */
function matchImportStatus(raw) {
  raw = String(raw || '').toLowerCase().trim();
  var list = statusList();
  if (!raw) return list[0].id;
  for (var i = 1; i < list.length + 1; i++) {
    var x = list[i % list.length];
    var keys = String(x.keywords || '').split(',').map(function (k) { return k.trim().toLowerCase(); }).filter(Boolean);
    keys.push(String(x.label).toLowerCase());
    for (var j = 0; j < keys.length; j++) if (raw.indexOf(keys[j]) >= 0) return x.id;
  }
  return list[0].id;
}

function doImport() {
  if (!editor) return;
  var s = session();
  function ci(id) { return parseInt(document.getElementById(id).value, 10); }
  var cFirst = ci('m_first'), cLast = ci('m_last'), cKlass = ci('m_klass'), cStatus = ci('m_status'), cArr = ci('m_arr'), cNotes = ci('m_notes');
  if (cFirst < 0 && cLast < 0) { toast('Pick at least a name column', true); return; }
  var mode = document.getElementById('m_mode').value;
  var incoming = [];
  var skipped = 0;
  importRows.slice(1).forEach(function (r) {
    var first = cFirst >= 0 ? String(r[cFirst]).trim() : '';
    var last = cLast >= 0 ? String(r[cLast]).trim() : '';
    // A real student always has a surname. Rows without one are almost always
    // spreadsheet totals ("Mean", "Median", "Standard Deviation") or blank
    // filler, so they are skipped rather than imported as students.
    if (cLast >= 0 ? !last : !first) { if (first || last) skipped++; return; }
    if (!first && !last) return;
    var status = cStatus >= 0 ? matchImportStatus(r[cStatus]) : defaultStatusId();
    var st = { id: uid(), first: first, last: last, klass: cKlass >= 0 ? String(r[cKlass]).trim() : '', status: status, roomId: null, row: null, seat: null,
               arrangements: cArr >= 0 ? String(r[cArr]).trim() : '', notes: cNotes >= 0 ? String(r[cNotes]).trim() : '' };
    routeStudent(s, st);
    incoming.push(st);
  });
  if (mode === 'replace') { s.students = incoming; s.settings.keepApart = []; }
  else s.students = s.students.concat(incoming);
  markDirty(); closeModal(); render();
  toast(incoming.length + ' students imported' +
    (skipped ? ', ' + skipped + ' non-student row' + (skipped > 1 ? 's' : '') + ' skipped (no surname)' : '') +
    ' — go to Seating Plan and click Generate');
}

/* ======================= VIEW: ROOMS ========================== */
function roomSummary(r) {
  if (r.kind !== 'seated') return 'list only, no seat numbers';
  var cap = usableSeats(r), total = r.rows * r.seatsPerRow;
  return r.rows + ' rows &times; ' + r.seatsPerRow + ' seats (' + cap + ' capacity' + (cap < total ? ', ' + (total - cap) + ' seats blocked' : '') + ')';
}

function viewRooms() {
  var s = session();
  if (!s) return noSessionMsg();
  var cards = s.rooms.map(function (r, i) {
    return '<div class="room-card ' + esc(r.purpose) + '"><h3>' + esc(r.name) + '</h3>' +
      '<div class="rc-sub">' + esc(purposeLabel(r.purpose)) + ' &middot; ' + roomSummary(r) +
      (r.layout && r.layout.supervisor ? '<br>Supervisor: ' + esc(r.layout.supervisor) : '') +
      '</div><div class="rc-actions"><button class="btn small secondary" onclick="roomModal(\'' + r.id + '\')">Edit</button>' +
      '<button class="btn small danger" onclick="deleteRoom(\'' + r.id + '\')">Delete</button>' +
      '<span class="rc-order">' +
      '<button class="btn small secondary" title="Fill this room earlier" onclick="moveRoom(\'' + r.id + '\',-1)"' + (i === 0 ? ' disabled' : '') + '>&#9650;</button>' +
      '<button class="btn small secondary" title="Fill this room later" onclick="moveRoom(\'' + r.id + '\',1)"' + (i === s.rooms.length - 1 ? ' disabled' : '') + '>&#9660;</button>' +
      '</span></div></div>';
  }).join('');
  var tmpls = DB.templates.map(function (t) {
    return '<div class="room-card"><h3>' + esc(t.name) + '</h3>' +
      '<div class="rc-sub">' + (t.rooms.map(function (r) { return esc(r.name); }).join(' &middot; ') || 'empty') + '</div>' +
      '<div class="rc-actions"><button class="btn small secondary" onclick="applyTemplate(\'' + t.id + '\')">Apply to this session</button>' +
      '<button class="btn small danger" onclick="deleteTemplate(\'' + t.id + '\')">Delete</button></div></div>';
  }).join('');
  return '<div class="section-head"><div><h2>Rooms &amp; Layout — ' + esc(s.name) + '</h2>' +
    '<p>Set up where this exam happens. Seat-grid rooms are filled in the order shown (use &#9650;&#9660; to change it); list rooms just hold names. Room types are set in <b>Settings</b>. Save a set of rooms as a template to reuse next time.</p></div>' +
    '<div class="toolbar"><button class="btn" onclick="roomModal()">+ Add room</button>' +

    (s.rooms.length ? '<div class="room-cards">' + cards + '</div>'

    (DB.templates.length ? '<div class="room-cards">' + tmpls + '</div>' : '<div class="empty-msg">No templates saved yet.</div>');
}

var BLOCK_NEXT = { '': 'aisle', aisle: 'unusable', unusable: '' };

/* Read the modal's inputs into the draft and redraw the seat map. */
function roomDraftChanged() {
  if (!roomDraft) return;
  var showGrid = purposeById(document.getElementById('f_purpose').value).layout === 'seated';
  document.getElementById('gridFields').style.display = showGrid ? 'block' : 'none';
  roomDraft.rows = Math.min(60, Math.max(1, parseInt(document.getElementById('f_rows').value, 10) || 12));
  roomDraft.seatsPerRow = Math.min(60, Math.max(1, parseInt(document.getElementById('f_seats').value, 10) || 18));
  var L = roomDraft.layout;
  L.rowLabels = document.getElementById('f_rowlab').value; L.rowFrom = document.getElementById('f_rowfrom').value;
  L.seatLabels = document.getElementById('f_seatlab').value; L.seatFrom = document.getElementById('f_seatfrom').value;
  Object.keys(L.blocked).forEach(function (k) {
    var p = k.split('_');
    if (Number(p[0]) > roomDraft.rows || Number(p[1]) > roomDraft.seatsPerRow) delete L.blocked[k];
  });
  drawMask();
}

function drawMask() {
  var el = document.getElementById('maskWrap');
  if (!el || !roomDraft) return;
  var d = roomDraft, B = d.layout.blocked;
  var t = '<table class="mask"><thead><tr><th></th>';
  for (var row = 1; row <= d.rows; row++) t += '<th onclick="maskLine(\'row\',' + row + ')">Row ' + esc(lineLabel(row, d.rows, d.layout.rowLabels, d.layout.rowFrom)) + '</th>';
  t += '</tr></thead><tbody>';
  for (var seat = 1; seat <= d.seatsPerRow; seat++) {
    t += '<tr><th onclick="maskLine(\'seat\',' + seat + ')">Seat ' + esc(lineLabel(seat, d.seatsPerRow, d.layout.seatLabels, d.layout.seatFrom)) + '</th>';
    for (var row2 = 1; row2 <= d.rows; row2++) {
      var b = B[row2 + '_' + seat] || '';
      t += '<td class="m ' + b + '" title="' + (b || 'open') + '" onclick="maskCell(' + row2 + ',' + seat + ')"></td>';
    }
    t += '</tr>';
  }
  var blocked = Object.keys(B).length;
  el.innerHTML = t + '</tbody></table><div class="muted" style="margin-top:6px">' + (d.rows * d.seatsPerRow - blocked) + ' usable seats' +
    (blocked ? ' &middot; ' + blocked + ' blocked' : '') + ' &middot; <span class="m-key aisle"></span> aisle <span class="m-key unusable"></span> unusable</div>';
}

function maskCell(row, seat) {
  if (!editor || !roomDraft) return;
  var B = roomDraft.layout.blocked, k = row + '_' + seat;
  var next = BLOCK_NEXT[B[k] || ''];
  if (next) B[k] = next; else delete B[k];
  drawMask();
}

function maskLine(kind, n) {
  if (!editor || !roomDraft) return;
  var d = roomDraft, B = d.layout.blocked, keys = [];
  if (kind === 'row') for (var seat = 1; seat <= d.seatsPerRow; seat++) keys.push(n + '_' + seat);
  else for (var row = 1; row <= d.rows; row++) keys.push(row + '_' + n);
  var allBlocked = keys.every(function (k) { return B[k]; });
  keys.forEach(function (k) { if (allBlocked) delete B[k]; else if (!B[k]) B[k] = 'aisle'; });
  drawMask();
}

/* =================== SEATING ENGINE + VIEW ====================
   Rules live in s.settings (per session, defaults from Settings):
     sortBy   surname | first | class | import | random
     pattern  all | alt-seat | alt-row | checker
     rowDir   front | back          seatDir  ltr | rtl | snake
     near     side | cross | all    (what counts as "next to" for keep-apart)
   With the defaults (surname, all, front, ltr, cross) the result is
   identical to the original engine.
   ================================================================ */
var SORT_OPTIONS = [['surname', 'Alphabetical by surname'], ['first', 'Alphabetical by first name'], ['class', 'Grouped by class, then surname'],
                    ['import', 'Import order (as in your spreadsheet)'], ['random', 'Random (reshuffle any time)']];
var PATTERN_OPTIONS = [['all', 'Every seat'], ['alt-seat', 'Every second seat'], ['alt-row', 'Every second row'], ['checker', 'Checkerboard (no one beside or behind)']];
var ROWDIR_OPTIONS = [['front', 'Front to back'], ['back', 'Back to front']];
var SEATDIR_OPTIONS = [['ltr', 'Seat 1 first, every row'], ['rtl', 'Far side first, every row'], ['snake', 'Snake (alternate direction each row)']];
var NEAR_OPTIONS = [['side', 'Side by side only'], ['cross', 'Side by side, in front or behind'], ['all', 'Any of the 8 surrounding seats']];

function optionsHTML(list, val) {
  return list.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
}

/* Seeded shuffle so "Random" gives the same plan until you reshuffle. */
function seededShuffle(list, seed) {
  var a = seed >>> 0 || 1;
  function rnd() { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  for (var i = list.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var tmp = list[i]; list[i] = list[j]; list[j] = tmp; }
  return list;
}

function sortCandidates(s, list) {
  var by = s.settings.sortBy;
  if (by === 'class') return list.sort(function (a, b) { return (a.klass || '').localeCompare(b.klass || '') || byName(a, b); });
  if (by === 'first') return list.sort(function (a, b) { return (a.first + a.last).localeCompare(b.first + b.last); });
  if (by === 'import') return list;                     // s.students keeps spreadsheet order
  if (by === 'random') return seededShuffle(list.sort(byName), s.settings.shuffleSeed);
  return list.sort(byName);
}

/* Every usable [row, seat] in a room, in the order the engine fills them. */
function seatOrder(s, r) {
  var set = s.settings, out = [];
  var rows = []; for (var i = 1; i <= r.rows; i++) rows.push(i);
  if (set.rowDir === 'back') rows.reverse();
  rows.forEach(function (row, ri) {
    var seats = []; for (var k = 1; k <= r.seatsPerRow; k++) seats.push(k);
    if (set.seatDir === 'rtl' || (set.seatDir === 'snake' && ri % 2 === 1)) seats.reverse();
    seats.forEach(function (seat) {
      if (seatBlocked(r, row, seat)) return;
      if (set.pattern === 'alt-seat' && seat % 2 === 0) return;
      if (set.pattern === 'alt-row' && row % 2 === 0) return;
      if (set.pattern === 'checker' && (row + seat) % 2 === 1) return;
      out.push([row, seat]);
    });
  });
  return out;
}

function autoSeat() {
  if (!editor) return;
  var s = session();
  var gridPurposes = cfg().purposes.filter(function (p) { return p.layout === 'seated'; });
  var gridRooms = s.rooms.filter(function (r) { return r.kind === 'seated'; });
  if (!gridRooms.length) { toast('Add a seat-grid room first (Rooms & Layout)', true); return; }
  s.students.forEach(function (st) { if (isSeatedStatus(st.status)) { st.roomId = null; st.row = null; st.seat = null; } });
  var seated = 0, leftover = 0, noRoom = [];
  gridPurposes.forEach(function (p) {
    var cands = sortCandidates(s, s.students.filter(function (st) { return statusPurpose(st.status) === p.id; }));
    if (!cands.length) return;
    var rooms = s.rooms.filter(function (r) { return r.purpose === p.id && r.kind === 'seated'; });
    if (!rooms.length) { noRoom.push(p.label); leftover += cands.length; return; }
    var i = 0;
    rooms.forEach(function (room) {
      seatOrder(s, room).forEach(function (pos) {
        if (i >= cands.length) return;
        var st = cands[i++];
        st.roomId = room.id; st.row = pos[0]; st.seat = pos[1];
      });
    });
    seated += i; leftover += cands.length - i;
  });
  s.students.forEach(function (st) { if (!isSeatedStatus(st.status)) routeStudent(s, st); });
  fixKeepApart(s);
  markDirty(); render();
  if (noRoom.length) toast('Seated ' + seated + ' students — no room set up for: ' + noRoom.join(', ') + '. Add one in Rooms & Layout.', true);
  else toast(leftover > 0 ? 'Seated ' + seated + ' students — ' + leftover + ' did not fit. Add rows or another room.' : 'Seated ' + seated + ' students', leftover > 0);
}

function adjacentPairs(s) {
  var bad = [], near = s.settings.near || 'cross';
  s.settings.keepApart.forEach(function (p) {
    var sa = s.students.find(function (x) { return x.id === p[0]; });
    var sb = s.students.find(function (x) { return x.id === p[1]; });
    if (!sa || !sb || !sa.row || !sb.row || sa.roomId !== sb.roomId) return;
    var dr = Math.abs(sa.row - sb.row), ds = Math.abs(sa.seat - sb.seat);
    var sideBySide = dr === 0 && ds === 1;
    var frontBack = ds === 0 && dr === 1;
    var diagonal = dr === 1 && ds === 1;
    if (sideBySide || (near !== 'side' && frontBack) || (near === 'all' && diagonal)) bad.push([sa, sb]);
  });
  return bad;
}

function fixKeepApart(s) {
  for (var pass = 0; pass < 4; pass++) {
    var bad = adjacentPairs(s);
    if (!bad.length) return;
    var before = bad.length;
    for (var b = 0; b < bad.length; b++) {
      var sb = bad[b][1];
      var seated = s.students.filter(function (st) { return st.row && st.id !== bad[b][0].id && st.id !== sb.id; });
      for (var k = 0; k < seated.length; k++) {
        var other = seated[k];
        var tmp = { roomId: sb.roomId, row: sb.row, seat: sb.seat };
        sb.roomId = other.roomId; sb.row = other.row; sb.seat = other.seat;
        other.roomId = tmp.roomId; other.row = tmp.row; other.seat = tmp.seat;
        if (adjacentPairs(s).length < before) break;
        var t2 = { roomId: sb.roomId, row: sb.row, seat: sb.seat };
        sb.roomId = other.roomId; sb.row = other.row; sb.seat = other.seat;
        other.roomId = t2.roomId; other.row = t2.row; other.seat = t2.seat;
      }
    }
    if (adjacentPairs(s).length >= before) return;
  }
}

function viewSeating() {
  var s = session();

  var conflicts = adjacentPairs(s);
  var conflictIds = {};
  conflicts.forEach(function (p) { conflictIds[p[0].id] = 1; conflictIds[p[1].id] = 1; });
  var unseated = s.students.filter(function (st) { return isSeatedStatus(st.status) && !st.row; }).sort(byName);
  var roomOpts = '<option value="all"' + (seatingRoomFilter === 'all' ? ' selected' : '') + '>All rooms</option>' +
    s.rooms.map(function (r) { return '<option value="' + r.id + '"' + (seatingRoomFilter === r.id ? ' selected' : '') + '>' + esc(r.name) + '</option>'; }).join('');

  var html = '<div class="view-note">View-only mode — this plan is live and up to date. Use the Print tab for paper copies.</div>' +
    '<div class="section-head"><div><h2>Seating Plan — ' + esc(s.name) + '</h2>' +
    '<p>Generate seating automatically, then click any two seats to swap those students, or click a student and then an empty seat to move them.</p></div></div>' +
    '<div class="seating-toolbar">' +
