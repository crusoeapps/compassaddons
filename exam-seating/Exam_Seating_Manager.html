    '<label style="margin:0">Order</label><select onchange="setSortBy(this.value)">' + optionsHTML(SORT_OPTIONS, s.settings.sortBy) + '</select>' +
    (s.settings.sortBy === 'random' ? '<button class="btn secondary" onclick="reshuffle()">Reshuffle</button>' : '') +
    '<button class="btn secondary" onclick="seatingRulesModal()">Seating rules</button>' +
    '<button class="btn secondary" onclick="keepApartModal()">Keep-apart pairs (' + s.settings.keepApart.length + ')</button>' +
    '<button class="btn secondary" onclick="clearSeatsConfirm()">Clear all seats</button>' +
    '<span class="tb-divider"></span></span>' +
    '<label style="margin:0">Show</label><select onchange="seatingRoomFilter=this.value;render()">' + roomOpts + '</select>' +
    (conflicts.length ? '<span class="pill withdrawn">' + conflicts.length + ' keep-apart conflict' + (conflicts.length > 1 ? 's' : '') + ' — highlighted red</span>' : '') + '</div>';

  if (unseated.length) {
    html += '<div class="unseated-panel editor-only"><h4>' + unseated.length + ' student' + (unseated.length > 1 ? 's' : '') + ' without a seat — click one, then click an empty seat</h4>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">' + unseated.map(function (st) {
        return '<span class="chip' + (selectedSeat && selectedSeat.studentId === st.id ? ' selected' : '') + '" onclick="pickUnseated(\'' + st.id + '\')">' + esc(st.first) + ' <b>' + esc(st.last) + '</b></span>';
      }).join('') + '</div></div>';
  }

  var rooms = s.rooms.filter(function (r) { return seatingRoomFilter === 'all' || r.id === seatingRoomFilter; });
  if (!rooms.length) html += '<div class="empty-msg">No rooms set up yet. Editors: add rooms in <b>Rooms &amp; Layout</b>.</div>';

  rooms.forEach(function (r) {
    var inRoom = s.students.filter(function (st) { return st.roomId === r.id; });
    html += '<div class="room-banner ' + esc(r.purpose) + '"><h3>' + esc(r.name) + '</h3><span>' + inRoom.length + ' students' +
      (r.kind === 'seated' ? ' &middot; ' + r.rows + ' &times; ' + r.seatsPerRow : '') +
      (r.layout && r.layout.supervisor ? ' &middot; Supervisor: ' + esc(r.layout.supervisor) : '') + '</span></div>';
    if (r.kind === 'seated') {
      var grid = {};
      inRoom.forEach(function (st) { if (st.row) grid[st.row + '_' + st.seat] = st; });
      var t = '<div class="seat-grid-wrap"><table class="seat-table"><thead><tr><th></th>';
      for (var row = 1; row <= r.rows; row++) t += '<th>Row ' + esc(rowLabel(r, row)) + '</th>';
      t += '</tr></thead><tbody>';
      for (var seat = 1; seat <= r.seatsPerRow; seat++) {
        t += '<tr><th>Seat ' + esc(seatLabel(r, seat)) + '</th>';
        for (var row2 = 1; row2 <= r.rows; row2++) {
          var blk = r.layout && r.layout.blocked[row2 + '_' + seat];
          if (blk) { t += '<td class="seat-cell blocked ' + blk + '" title="' + (blk === 'aisle' ? 'Aisle' : 'Unusable seat') + '"></td>'; continue; }
          var st2 = grid[row2 + '_' + seat];
          var cls = 'seat-cell';
          if (st2 && selectedSeat && selectedSeat.studentId === st2.id) cls += ' selected';
          if (st2 && conflictIds[st2.id]) cls += ' conflict';
          t += '<td class="' + cls + '" onclick="seatClick(\'' + r.id + '\',' + row2 + ',' + seat + ')"' +
            (st2 ? ' title="' + esc(st2.first + ' ' + st2.last + (st2.klass ? ' - ' + st2.klass : '') + (st2.arrangements ? ' - ' + st2.arrangements : '')) + '"' : '') + '>' +
            (st2 ? '<span class="sc-first">' + esc(st2.first) + '</span><span class="sc-lastn">' + esc(st2.last) + '</span>' : '') + '</td>';
        }
        t += '</tr>';
      }
      html += t + '</tbody></table></div>';
    } else {
      html += '<div class="chip-list">' + (inRoom.slice().sort(byName).map(function (st) {
        return '<span class="chip">' + esc(st.first) + ' <b>' + esc(st.last) + '</b> <span class="muted">&middot; ' + esc(statusLabel(st.status)) + '</span></span>';
      }).join('') || '<span class="muted">Nobody assigned</span>') + '</div>';
    }
  });
  return html;
}

function pickUnseated(id) {
  if (!editor) return;
  selectedSeat = selectedSeat && selectedSeat.studentId === id ? null : { studentId: id };
  render();
}

function seatClick(roomId, row, seat) {
  if (!editor) return;
  var s = session();
  var room = s.rooms.find(function (x) { return x.id === roomId; });
  if (!room || seatBlocked(room, row, seat)) { toast('That seat is blocked — change it in Rooms & Layout', true); return; }
  var here = s.students.find(function (st) { return st.roomId === roomId && st.row === row && st.seat === seat; });
  if (!selectedSeat) {
    if (here) { selectedSeat = { studentId: here.id }; render(); }
    return;
  }
  var moving = s.students.find(function (st) { return st.id === selectedSeat.studentId; });
  if (!moving) { selectedSeat = null; render(); return; }
  if (here && here.id === moving.id) { selectedSeat = null; render(); return; }
  var from = { roomId: moving.roomId, row: moving.row, seat: moving.seat };
  moving.roomId = roomId; moving.row = row; moving.seat = seat;
  if (here) { here.roomId = from.roomId; here.row = from.row; here.seat = from.seat; }
  selectedSeat = null;
  markDirty(); render();
  toast(here ? 'Swapped ' + moving.last + ' and ' + here.last : 'Moved ' + moving.first + ' ' + moving.last + ' to Row ' + rowLabel(room, row) + ', Seat ' + seatLabel(room, seat));
}

function clearSeatsConfirm() {
  if (!editor) return;
  openModal('Clear all seats?', '<p>Removes every seat assignment in this session. Students stay on the list and you can regenerate at any time.</p>',
    [{ label: 'Clear seats', cls: 'btn danger', fn: function () {
      if (!editor) return;
      var s = session();
      s.students.forEach(function (st) { if (isSeatedStatus(st.status)) { st.roomId = null; st.row = null; st.seat = null; } });
      markDirty(); closeModal(); render();
    } }]);
}

var NEAR_TEXT = { side: 'side by side', cross: 'side by side, or front and back', all: 'in any of the 8 surrounding seats' };

function keepApartModal() {
  if (!editor) return;
  var s = session();
  var opts = s.students.filter(function (st) { return isSeatedStatus(st.status); }).sort(byName)
    .map(function (st) { return '<option value="' + st.id + '">' + esc(st.last) + ', ' + esc(st.first) + '</option>'; }).join('');
  var pairs = s.settings.keepApart.map(function (p, i) {
    var a = s.students.find(function (x) { return x.id === p[0]; });
    var b = s.students.find(function (x) { return x.id === p[1]; });
    if (!a || !b) return '';
    return '<div class="ka-row"><span class="chip">' + esc(a.last) + ', ' + esc(a.first) + '</span> &harr; ' +
      '<span class="chip">' + esc(b.last) + ', ' + esc(b.first) + '</span>' +
      (p[2] ? '<span class="muted ka-reason">' + esc(p[2]) + '</span>' : '') +
      '<button class="btn small danger" onclick="removeKA(' + i + ')">&#10005;</button></div>';
  }).join('');
  openModal('Keep-apart pairs',
    '<p class="muted" style="margin-bottom:12px">These pairs are never seated ' + NEAR_TEXT[s.settings.near || 'cross'] + ' (change this under <b>Seating rules</b>). Applied when you generate seating; any conflict shows red on the plan.</p>' +
    (pairs || '<p class="muted">No pairs yet.</p>') +
    '<div class="ka-row" style="margin-top:14px"><select id="ka_a" style="flex:1">' + opts + '</select>' +
    '<select id="ka_b" style="flex:1">' + opts + '</select>' +
    '<button class="btn small" onclick="addKA()">Add pair</button></div>' +
    '<div class="form-row" style="margin-top:8px"><input type="text" id="ka_reason" placeholder="Reason (optional, editors only see this)" style="width:100%"></div>', [], true);
}

function addKA() {
  if (!editor) return;
  var s = session();
  var a = document.getElementById('ka_a').value, b = document.getElementById('ka_b').value;
  var reason = (document.getElementById('ka_reason') || { value: '' }).value.trim();
  if (!a || !b || a === b) { toast('Pick two different students', true); return; }
  var dupe = s.settings.keepApart.some(function (p) { return (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a); });
  if (dupe) { toast('That pair already exists', true); return; }
  s.settings.keepApart.push(reason ? [a, b, reason] : [a, b]);
  markDirty(); keepApartModal();
}

function removeKA(i) {
  if (!editor) return;
  session().settings.keepApart.splice(i, 1);
  markDirty(); keepApartModal();
}

/* ===================== VIEW: SETTINGS (editors) =====================
   School-wide settings. Edits go into settingsDraft and only reach
   DB.config when "Save settings" passes validation, so a half-finished
   change never affects the plan. Saving is version-checked like
   sessions (see saveConfigNow in part2_core.js).
   ================================================================ */
var LOGO_MAX_CHARS = 40000;   // a Google Sheets cell holds 50,000 characters

function validLogo(src) { return /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(String(src || '')); }

/* Apply school name, tagline, accent colour and logo to the page. */
function applyBranding() {
  if (!DB || !DB.config) return;
  var sc = cfg().school;
  document.title = sc.name + ' — Exam Seating Manager';
  var sub = document.getElementById('brandSub');
  if (sub) sub.innerHTML = esc(sc.name) + (sc.tagline ? ' &middot; ' + esc(sc.tagline) : '');
  var logo = document.getElementById('brandLogo');
  if (logo) {
    if (validLogo(sc.logo)) { logo.src = sc.logo; logo.style.display = ''; }
    else { logo.removeAttribute('src'); logo.style.display = 'none'; }
  }
  var root = document.documentElement.style, head = document.querySelector('header');
  var a = isHex(sc.accent) ? sc.accent.toLowerCase() : DEFAULT_ACCENT;
  if (a === DEFAULT_ACCENT) {
    root.removeProperty('--navy'); root.removeProperty('--blue');
    if (head) head.style.background = '';
  } else {
    root.setProperty('--navy', a); root.setProperty('--blue', mixHex(a, '#ffffff', 0.15));
    if (head) head.style.background = 'linear-gradient(135deg, ' + mixHex(a, '#000000', 0.2) + ' 0%, ' + a + ' 60%, ' + mixHex(a, '#ffffff', 0.15) + ' 100%)';
  }
}
function mixHex(a, b, t) {
  var x = hexToRgb(a), y = hexToRgb(b);
  return '#' + x.map(function (v, i) { return ('0' + Math.round(v + (y[i] - v) * t).toString(16)).slice(-2); }).join('');
}

function draft() {
  if (!settingsDraft) settingsDraft = clone(cfg());
  return settingsDraft;
}
function draftDirty() { return settingsDraft && JSON.stringify(settingsDraft) !== JSON.stringify(cfg()); }

/* Generic setter used by inputs: path like "school.name" or "statuses.2.label". */
function setDraft(path, value) {
  if (!editor) return;
  var parts = path.split('.'), o = draft();
  for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
  var bar = document.getElementById('settingsBar');
  if (bar) bar.className = 'settings-bar' + (draftDirty() ? ' dirty' : '');
}
function inputAttr(path, val, type) {
  return ' value="' + esc(val == null ? '' : val) + '" onchange="setDraft(\'' + path + '\', this.' + (type === 'check' ? 'checked' : 'value') + ')"';
}

function orderButtons(list, i, n) {
  return '<button class="btn small secondary" onclick="moveDraft(\'' + list + '\',' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>&#9650;</button>' +
    '<button class="btn small secondary" onclick="moveDraft(\'' + list + '\',' + i + ',1)"' + (i === n - 1 ? ' disabled' : '') + '>&#9660;</button>';
}
function moveDraft(list, i, dir) {
  if (!editor) return;
  var a = draft()[list], j = i + dir;
  if (j < 0 || j >= a.length) return;
  var t = a[i]; a[i] = a[j]; a[j] = t;
  render();
}
function toggleCol(key, col, on) {
  if (!editor) return;
  var P = draft().print;
  P[key] = Object.keys(PRINT_COLS).filter(function (c) { return c === col ? on : P[key].indexOf(c) >= 0; });
  setDraft('print.' + key, P[key]);
}

function addPurpose() {
  if (!editor) return;
  draft().purposes.push({ id: 'p_' + uid(), label: 'New room type', layout: 'list', printTitle: '' });
  render();
}
function addStatus() {
  if (!editor) return;
  var d = draft();
  var listP = d.purposes.find(function (p) { return p.layout !== 'seated'; }) || d.purposes[0];
  d.statuses.push({ id: 's_' + uid(), label: 'New status', purpose: listP.id, color: '#6b7a99', keywords: '' });
  render();
}

/* Everything that might use a status or room type, across ALL sessions
   (remote sessions load lazily, so load them first). */
async function usageAcrossSessions(test) {
  if (remote()) {
    toast('Checking every session…');
    try { await ensureAllLoaded(); }
    catch (e) { toast('Could not check every session: ' + e.message + ' — try again', true); return null; }
  }
  var hits = [];
  DB.sessions.forEach(function (s) {
    var n = test(s);
    if (n) hits.push(s.name + ' (' + n + ')');
  });
  return hits;
}

async function removeStatus(i) {
  if (!editor) return;
  var d = draft(), x = d.statuses[i];
  if (d.statuses.length === 1) { toast('Keep at least one status', true); return; }
  var hits = await usageAcrossSessions(function (s) { return s.students.filter(function (st) { return st.status === x.id; }).length; });
  if (hits === null) return;
  if (hits.length) {
    openModal('Status still in use', '<p><b>' + esc(x.label) + '</b> is still given to students in: ' + esc(hits.join(', ')) +
      '.</p><p style="margin-top:8px">Change those students to another status first (Students &rarr; Edit), then delete it.</p>', []);
    return;
  }
  d.statuses.splice(i, 1);
  render();
}

async function removePurpose(i) {
  if (!editor) return;
  var d = draft(), p = d.purposes[i];
  if (d.purposes.length === 1) { toast('Keep at least one room type', true); return; }
  var users = d.statuses.filter(function (x) { return x.purpose === p.id; }).map(function (x) { return x.label; });
  if (users.length) { toast('Statuses still go to "' + p.label + '": ' + users.join(', ') + '. Point them at another room type first.', true); return; }
  var hits = await usageAcrossSessions(function (s) { return s.rooms.filter(function (r) { return r.purpose === p.id; }).length; });
  if (hits === null) return;
  if (hits.length) {
    openModal('Room type still in use', '<p>Rooms of type <b>' + esc(p.label) + '</b> exist in: ' + esc(hits.join(', ')) +
      '.</p><p style="margin-top:8px">Change or delete those rooms first (Rooms &amp; Layout).</p>', []);
    return;
  }
  d.purposes.splice(i, 1);
  render();
}

function pickLogo() {
  if (!editor) return;
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/png,image/jpeg';
  inp.onchange = function () { if (inp.files[0]) loadLogo(inp.files[0]); };
  inp.click();
}
/* Shrink the logo in the browser so it fits in one Sheet cell. */
function loadLogo(file) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, 96 / img.height, 360 / img.width);
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL('image/png');
      if (data.length > LOGO_MAX_CHARS) {
        var g = c.getContext('2d'); g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', 0.8);
      }
      if (data.length > LOGO_MAX_CHARS) { toast('That logo is too detailed to store. Try a simpler or smaller image.', true); return; }
      setDraft('school.logo', data); render();
    };
    img.onerror = function () { toast('Could not read that image. Use a PNG or JPG file.', true); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function discardSettings() {
  if (!editor) return;
  settingsDraft = null; render();
  toast('Changes discarded');
}

function validateDraft(d) {
  if (!String(d.school.name || '').trim()) return 'Enter the school name.';
  if (!isHex(d.school.accent)) return 'The accent colour is not valid.';
  if (d.school.logo && !validLogo(d.school.logo)) return 'The logo is not a valid image. Remove it and choose it again.';
  var seen = {};
  for (var i = 0; i < d.purposes.length; i++) {
    var p = d.purposes[i], k = String(p.label || '').trim().toLowerCase();
    if (!k) return 'Every room type needs a name.';
    if (seen['p' + k]) return 'Two room types are both called "' + p.label + '". Give each a different name.';
    seen['p' + k] = 1;
    if (p.layout !== 'seated' && p.layout !== 'list') p.layout = 'list';
  }
  for (var j = 0; j < d.statuses.length; j++) {
    var x = d.statuses[j], ks = String(x.label || '').trim().toLowerCase();
    if (!ks) return 'Every status needs a name.';
    if (seen['s' + ks]) return 'Two statuses are both called "' + x.label + '". Give each a different name.';
    seen['s' + ks] = 1;
    if (!isHex(x.color)) return 'The colour for "' + x.label + '" is not valid.';
    if (!d.purposes.some(function (p) { return p.id === x.purpose; })) return 'Choose a room type for "' + x.label + '".';
  }
  if (!d.statuses.length) return 'Keep at least one status.';
  if (!d.purposes.length) return 'Keep at least one room type.';
  return '';
}

async function saveSettings() {
  if (!editor) return;
  var d = draft();
  d.school.name = d.school.name.trim();
  d.purposes.forEach(function (p) { p.label = p.label.trim(); p.printTitle = String(p.printTitle || '').trim(); });
  d.statuses.forEach(function (x) { x.label = x.label.trim(); });
  var err = validateDraft(d);
  if (err) { toast(err, true); return; }
  var before = DB.config;
  // Built-in room types carry fixed card wording; drop it once their print title is changed.
  d.purposes.forEach(function (p) {
    var old = before.purposes.find(function (o) { return o.id === p.id; });
    if (old && old.printTitle !== p.printTitle) { delete p.printCard; delete p.printDesc; }
  });
  DB.config = clone(d);
  var ok = await saveConfigNow();
  if (!ok) { DB.config = before; render(); return; }
  settingsDraft = null;
  applyBranding();
  if (routingKey(before) !== routingKey(DB.config)) {
    if (remote()) { try { await ensureAllLoaded(); } catch (e) { toast('Some sessions could not be updated: ' + e.message + '. Open each one to refresh it.', true); } }
    await reconcileSessions();
  }
  render();
  toast('Settings saved');
}

/* After room types or status routing change, put students where the new
   rules say — only those now in the wrong kind of room move. */
function routingKey(c) {
  return JSON.stringify([c.purposes.map(function (p) { return [p.id, p.layout]; }), c.statuses.map(function (x) { return [x.id, x.purpose]; })]);
}
async function reconcileSessions() {
  for (var i = 0; i < DB.sessions.length; i++) {
    var s = DB.sessions[i];
    if (!s.loaded && remote()) continue;           // could not be loaded; untouched
    var snapshot = JSON.stringify([s.rooms, s.students]);
    normaliseSession(s);
    s.students.forEach(function (st) {
      var want = statusPurpose(st.status);
      var r = st.roomId ? s.rooms.find(function (x) { return x.id === st.roomId; }) : null;
      if (r && r.purpose === want && (r.kind !== 'seated' || st.row)) return;   // right room (and seated if it's a grid)
      if (!r && isSeatedStatus(st.status)) return;   // waiting for a seat is fine
      routeStudent(s, st);
    });
    if (JSON.stringify([s.rooms, s.students]) !== snapshot) {
      if (remote()) await saveSessionNow(s); else lsSet(CONFIG.STORAGE_KEY, JSON.stringify(DB));
    }
  }
}

/* ===================== SAVE / OPEN PLAN FILES =====================
   "Save to file" downloads everything (settings, room templates, every
   session with its students, rooms, seats and keep-apart pairs) as one
   .json file. Anyone can save a copy of what they can see.
   "Open file" (editors only) loads one back:
     - local mode: replace everything in this browser, or add the file's
       sessions alongside the ones already here;
     - shared mode: add the file's sessions to the shared data as NEW
       sessions (it never overwrites anyone's existing work).
   Real student data lives in these files, so they stay on the user's
   own computer; nothing here sends them anywhere except the app's own
   backend.
   ================================================================ */
var PLAN_FILE_APP = 'Exam Seating Manager';
var PLAN_FILE_FORMAT = 1;
var openedPlan = null;   // parsed file waiting for the user to choose replace / add

function planFileName() {
  var d = new Date();
  var stamp = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  return (cfg().school.name + ' exam seating ' + stamp).replace(/[^a-z0-9 _-]+/gi, '').replace(/\s+/g, '_') + '.json';
}

function sessionForFile(s) {
  var c = clone(s);
  delete c.loaded; delete c.version;
  return c;
}

async function savePlanFile() {
  if (remote()) {
    toast('Gathering every session…');
    try { await ensureAllLoaded(); }
    catch (e) { toast('Could not load every session to save: ' + e.message + ' — check your connection and try again', true); return; }
  }
  var file = {
    app: PLAN_FILE_APP, format: PLAN_FILE_FORMAT, savedAt: new Date().toISOString(),
    config: clone(cfg()),
    templates: clone(DB.templates),
    sessions: DB.sessions.map(sessionForFile),
    activeSessionId: DB.activeSessionId
  };
  var blob = new Blob([JSON.stringify(file, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = planFileName();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  toast('Saved ' + DB.sessions.length + ' session' + (DB.sessions.length === 1 ? '' : 's') + ' to ' + a.download + ' — keep it somewhere private, it has student names');
}

function openPlanFile() {
  if (!editor) return;
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function () { if (inp.files[0]) readPlanFile(inp.files[0]); };
  inp.click();
}

/* Check a parsed file is ours and well-formed. Returns an error message or ''. */
function checkPlanFile(f) {
  if (!isPlainObj(f) || f.app !== PLAN_FILE_APP) return 'That file is not an Exam Seating plan. Choose a file made with "Save to file".';
  if (Number(f.format) > PLAN_FILE_FORMAT) return 'That plan was saved by a newer version of the app. Use the latest app to open it.';
  if (!Array.isArray(f.sessions)) return 'That plan file is damaged (no sessions found).';
  for (var i = 0; i < f.sessions.length; i++) {
    var s = f.sessions[i];
    if (!isPlainObj(s) || !s.name || !Array.isArray(s.students) || !Array.isArray(s.rooms)) return 'That plan file is damaged (session ' + (i + 1) + ' is incomplete).';
  }
  return '';
}

function readPlanFile(file) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var f;
    try { f = JSON.parse(e.target.result); }
    catch (err) { toast('Could not read that file — it is not a saved plan.', true); return; }
    var err2 = checkPlanFile(f);
    if (err2) { toast(err2, true); return; }
    openedPlan = f;
    var students = f.sessions.reduce(function (n, s) { return n + s.students.length; }, 0);
    var names = f.sessions.map(function (s) { return esc(s.name); }).join(', ') || 'no sessions';
    var saved = f.savedAt ? new Date(f.savedAt).toLocaleString() : 'unknown date';
    var body = '<p>This file has <b>' + f.sessions.length + ' session' + (f.sessions.length === 1 ? '' : 's') + '</b> (' + students + ' students), saved ' + esc(saved) + ':</p>' +
      '<p class="muted" style="margin:6px 0 12px">' + names + '</p>';
    var buttons;
    if (remote()) {
      body += '<p>They will be <b>added to the shared data as new sessions</b>. Nothing already there is changed.</p>';
      buttons = [{ label: 'Add sessions', cls: 'btn', fn: function () { applyPlanFile('add'); } }];
    } else {
      body += '<p><b>Replace</b> swaps everything in this browser (sessions, settings and templates) for the file. <b>Add</b> keeps what is here and adds the file\'s sessions as copies.</p>';
      buttons = [{ label: 'Add sessions', cls: 'btn secondary', fn: function () { applyPlanFile('add'); } },
                 { label: 'Replace everything', cls: 'btn danger', fn: function () { applyPlanFile('replace'); } }];
    }
    openModal('Open plan file', body, buttons);
  };
  reader.onerror = function () { toast('Could not read that file. Try again.', true); };
  reader.readAsText(file);
}

/* Add statuses / room types the file uses that this school's settings lack,
   so imported students keep their status and rooms keep their type. */
function mergeMissingSettings(fileConfig) {
  var fc = migrateConfig(clone(fileConfig || {}));
  var c = cfg(), added = 0;
  fc.purposes.forEach(function (p) { if (!c.purposes.some(function (x) { return x.id === p.id; })) { c.purposes.push(p); added++; } });
  fc.statuses.forEach(function (x) { if (!c.statuses.some(function (y) { return y.id === x.id; })) { c.statuses.push(x); added++; } });
  return added;
}

async function applyPlanFile(mode) {
  if (!editor || !openedPlan) return;
  var f = openedPlan;
  openedPlan = null;
  closeModal();
  var incoming = f.sessions.map(function (s) { return clone(s); });

  if (mode === 'replace' && !remote()) {
    DB = migrateDB({ version: 1, config: f.config, templates: clone(f.templates || []), sessions: incoming,
                     activeSessionId: f.activeSessionId });
    DB.sessions.forEach(function (s) { s.loaded = true; s.version = 1; });
    if (!DB.sessions.some(function (s) { return s.id === DB.activeSessionId; })) DB.activeSessionId = DB.sessions.length ? DB.sessions[0].id : null;
    lsSet(CONFIG.STORAGE_KEY, JSON.stringify(DB));
    settingsDraft = null; applyBranding(); go('sessions');
    toast('Plan opened — ' + DB.sessions.length + ' session' + (DB.sessions.length === 1 ? '' : 's') + ' loaded');
    return;
  }

  // ADD: every session arrives as a new one, with fresh ids so nothing collides.
  var settingsAdded = mergeMissingSettings(f.config);
  if (settingsAdded && remote() && !(await saveConfigNow())) {
    toast('Sessions not added: the statuses or room types they need could not be saved to Settings.', true);
    return;
  }
  var added = 0;
  for (var i = 0; i < incoming.length; i++) {
    var s = incoming[i];
    var roomIds = {}, stuIds = {};
    s.rooms.forEach(function (r) { var n = uid(); roomIds[r.id] = n; r.id = n; });
    s.students.forEach(function (st) { var n = uid(); stuIds[st.id] = n; st.id = n; st.roomId = st.roomId ? roomIds[st.roomId] || null : null; });
    s.settings = isPlainObj(s.settings) ? s.settings : {};
    s.settings.keepApart = (s.settings.keepApart || []).filter(function (p) { return stuIds[p[0]] && stuIds[p[1]]; })
      .map(function (p) { var q = [stuIds[p[0]], stuIds[p[1]]]; if (p[2]) q.push(p[2]); return q; });
    if (DB.sessions.some(function (x) { return x.name === s.name; })) s.name = s.name + ' (from file)';
    s.id = uid(); s.version = 1; s.loaded = true;
    migrateSession(s);
    if (remote()) {
      try {
        var out = await apiPost({ action: 'createSession', password: editorPassword, name: s.name, examDate: s.date || '', yearLevels: s.group || '',
                                  settingsJson: JSON.stringify(sessionSettingsForSave(s)) });
        if (!out.ok) throw new Error(out.error || 'create failed');
        s.id = out.session.sessionId; s.version = Number(out.session.version) || 1;
        DB.sessions.push(s);
        if (!(await saveSessionNow(s))) throw new Error('the session was created but its students could not be saved');
      } catch (e) {
        toast('Stopped after ' + added + ' session' + (added === 1 ? '' : 's') + ': ' + e.message + ' — check your connection and try again', true);
        render(); return;
      }
    } else {
      DB.sessions.push(s);
    }
    added++;
  }
  if (!remote()) lsSet(CONFIG.STORAGE_KEY, JSON.stringify(DB));
  settingsDraft = null; go('sessions');
  toast('Added ' + added + ' session' + (added === 1 ? '' : 's') + ' from the file' + (settingsAdded ? ' (and ' + settingsAdded + ' status / room type' + (settingsAdded === 1 ? '' : 's') + ' they use)' : ''));
}

function viewLookup() {

    '<div class="search-results" id="searchResults"><div class="empty-msg" style="border:none;background:none">Start typing to search</div></div></div>';

function doSearch(q) {
  var s = session();
  var el = document.getElementById('searchResults');
  if (!s || !q.trim()) { el.innerHTML = '<div class="empty-msg" style="border:none;background:none">Start typing to search</div>'; return; }

  if (!hits.length) { el.innerHTML = '<div class="empty-msg" style="border:none;background:none">No students found in this session.</div>'; return; }
  el.innerHTML = hits.map(function (st) {

      '<div class="result-name">' + esc(st.last) + '</div><div class="result-details">' + loc + '</div></div>' +

}

var PRINT_CSS =

  '.sub { font-size: 8pt; color: #666; margin: 2px 0 10px; }' +

function printCSS() {
  var a = cfg().school.accent;
  return isHex(a) && a.toLowerCase() !== DEFAULT_ACCENT ? PRINT_CSS.split(DEFAULT_ACCENT).join(a) : PRINT_CSS;
}

function printHTML(title, bodyHtml, portrait) {
  var page = '@page { size: A4 ' + (portrait ? 'portrait' : 'landscape') + '; margin: 6mm; }';
  var doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">' +
    '<style>' + printCSS() + page + '</style></head><body>' + bodyHtml + '</body></html>';
  // Hidden iframe: works where window.open() is blocked (sandboxed previews, some SOE browsers).
  var frame = document.createElement('iframe');
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(frame);
  frame.contentDocument.open();
  frame.contentDocument.write(doc);
  frame.contentDocument.close();
  setTimeout(function () {
    try { frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch (e) { toast('Print failed: ' + e.message, true); }
    setTimeout(function () { frame.remove(); }, 4000);
  }, 600);
}

/* Optional lines (logo, times, supervisor, instructions) appear only when set,
   so with default settings the sheets are exactly as before. */
function printHeader(title, room) {
  var s = session(), c = cfg(), P = c.print;
  var logo = validLogo(c.school.logo) ? '<img src="' + esc(c.school.logo) + '" alt="" style="height:12mm;float:right;margin-left:6mm">' : '';
  var extra = [];
  if (P.showTimes && (s.settings.startTime || s.settings.finishTime)) {
    extra.push('Start ' + esc(s.settings.startTime || '—') + ' &middot; Finish ' + esc(s.settings.finishTime || '—'));
  }
  if (P.showSupervisor && room && room.layout && room.layout.supervisor) extra.push('Supervisor: ' + esc(room.layout.supervisor));
  if (P.instructions) extra.push(esc(P.instructions));
  return logo + '<h1>' + esc(c.school.name) + ' — ' + esc(title) + '</h1><div class="sub">' + esc(s.name) +
    (s.group ? ' &middot; ' + esc(s.group) : '') + (s.date ? ' &middot; ' + esc(s.date) : '') +
    ' &middot; printed ' + new Date().toLocaleDateString() + '</div>' +
    extra.map(function (x) { return '<div class="sub" style="font-size:9pt;color:#1a2540">' + x + '</div>'; }).join('');
}

/* Shrink a name's font so it fits its grid box. Width is measured with the
   print font on a canvas; names that already fit keep the normal size (so
   default output is unchanged). Returns '' or an inline style. */
var _fitCanvas = null;
function fitStyle(text, basePt, availPt, bold, upper) {
  if (!text) return '';
  try {
    _fitCanvas = _fitCanvas || document.createElement('canvas');
    var g = _fitCanvas.getContext('2d');
    g.font = (bold ? '700 ' : '400 ') + '100px "DM Sans", Arial, sans-serif';
    var em = g.measureText(upper ? String(text).toUpperCase() : String(text)).width / 100;
    var fit = availPt / em * 0.92;                       // small safety margin
    if (fit >= basePt) return '';
    return ' style="font-size:' + Math.max(2.5, Math.floor(fit * 10) / 10) + 'pt"';
  } catch (e) { return ''; }
}
/* Usable width of one seat box on the printed grid, in points. */
function gridCellPt(r, portrait) {
  var pageMm = portrait ? 210 : 297;
  var cellMm = (pageMm - 12 - 16 - 9) / r.rows - 1.1;   // page margins, body padding, Seat column, cell padding
  return cellMm * 72 / 25.4;
}

function printRoomSheet(roomId) {
  var s = session();
  var r = s.rooms.find(function (x) { return x.id === roomId; });
  var grid = {};
  s.students.forEach(function (st) { if (st.roomId === roomId && st.row) grid[st.row + '_' + st.seat] = st; });
  var portrait = cfg().print.gridOrientation === 'portrait';
  var avail = gridCellPt(r, portrait);
  var t = '<table><thead><tr><th class="rowhead"></th>';
  for (var row = 1; row <= r.rows; row++) t += '<th>Row ' + esc(rowLabel(r, row)) + '</th>';
  t += '</tr></thead><tbody>';
  for (var seat = 1; seat <= r.seatsPerRow; seat++) {
    t += '<tr><th class="rowhead">Seat ' + esc(seatLabel(r, seat)) + '</th>';
    for (var row2 = 1; row2 <= r.rows; row2++) {
      var blk = seatBlocked(r, row2, seat);
      if (blk) { t += '<td style="background:#e4e4e4"></td>'; continue; }
      var st = grid[row2 + '_' + seat];
      t += '<td>' + (st ? '<span class="f"' + fitStyle(st.first, 6, avail, false, false) + '>' + esc(st.first) + '</span>' +
                          '<span class="l"' + fitStyle(st.last, 6.8, avail, true, true) + '>' + esc(st.last) + '</span>' : '') + '</td>';
    }
    t += '</tr>';
  }
  t += '</tbody></table>';
  printHTML(r.name + ' seat grid', printHeader(r.name + ' Supervisor Sheet', r) + t, portrait);
}

/* Print columns, chosen in Settings → Print. */
var PRINT_COLS = {
  student: ['Student', function (s, st) { return '<b>' + esc(st.last) + '</b>, ' + esc(st.first); }],
  first: ['First name', function (s, st) { return esc(st.first); }],
  last: ['Last name', function (s, st) { return '<b>' + esc(st.last) + '</b>'; }],
  klass: ['Class', function (s, st) { return esc(st.klass || ''); }],
  status: ['Status', function (s, st) { return esc(statusLabel(st.status)); }],
  location: ['Location', function (s, st) { return locText(s, st); }],
  room: ['Room', function (s, st) { return esc(st.roomId ? roomName(s, st.roomId) : '—'); }],
  row: ['Row', function (s, st) { var r = s.rooms.find(function (x) { return x.id === st.roomId; }); return st.row && r ? '<b>' + esc(rowLabel(r, st.row)) + '</b>' : ''; }],
  seat: ['Seat', function (s, st) { var r = s.rooms.find(function (x) { return x.id === st.roomId; }); return st.seat && r ? '<b>' + esc(seatLabel(r, st.seat)) + '</b>' : ''; }],
  arrangements: ['Arrangements', function (s, st) { return esc(st.arrangements || ''); }],
  notes: ['Notes', function (s, st) { return esc(st.notes || ''); }]
};
function validCols(cols) { return (cols || []).filter(function (c) { return PRINT_COLS[c]; }); }
function listTable(s, list, cols) {
  return '<table class="list"><thead><tr>' + cols.map(function (c) { return '<th>' + PRINT_COLS[c][0] + '</th>'; }).join('') + '</tr></thead><tbody>' +
    list.map(function (st) { return '<tr>' + cols.map(function (c) { return '<td>' + PRINT_COLS[c][1](s, st) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table>';
}

function printMasterList() {
  var s = session();
  var cols = validCols(cfg().print.masterCols);
  if (!cols.length) cols = ['student'];
  printHTML('Master list', printHeader('Master Student List') + listTable(s, s.students.slice().sort(byName), cols),
    cfg().print.listOrientation !== 'landscape');
}

/* One list per room type that has a print title (Settings → Room types). */
function printPurposeList(purposeId) {
  var s = session();
  var p = purposeById(purposeId);
  var title = p.printTitle || p.label;
  var list = s.students.filter(function (st) { return statusPurpose(st.status) === purposeId; }).sort(byName);
  var cols = validCols(cfg().print.listCols);
  if (!cols.length) cols = ['student'];
  if (cols.indexOf('arrangements') < 0 && list.some(function (st) { return st.arrangements; })) cols = cols.concat(['arrangements']);
  printHTML(title, printHeader(title) +
    (list.length ? listTable(s, list, cols) : '<p>No students in this category.</p>'), cfg().print.listOrientation !== 'landscape');
}

/* ======================== VIEW: HELP ========================== */
function viewHelp() {
  var statusNames = statusList().map(function (x) { return x.label; }).join(', ');
  var listStatusNames = statusList().filter(function (x) { return !isSeatedStatus(x.id); }).map(function (x) { return x.label; }).join(', ');
  var gridNames = cfg().purposes.filter(function (p) { return p.layout === 'seated'; }).map(function (p) { return p.label; }).join(' / ');
  var listNames = cfg().purposes.filter(function (p) { return p.layout !== 'seated'; }).map(function (p) { return p.label; }).join(', ');
  var guides = [
    ['Set up a new exam (coordinators)',
      '<ol><li>Click <b>Editor sign in</b> (top right) and enter the editor password.</li>' +
      '<li>Go to <b>Exam Sessions</b> then <b>+ New session</b>. Name it, set the year group and date. If a room template exists, choose it and your rooms are ready instantly.</li>' +
      '<li>If you started blank, go to <b>Rooms &amp; Layout</b> and add a seat-grid room (' + esc(gridNames) + ') with its rows and seats, plus a list room for each of: ' + esc(listNames || 'none') + '.</li>' +
      '<li>Go to <b>Students</b> then <b>Import Excel / CSV</b> and load your class list.</li>' +
      '<li>Go to <b>Seating Plan</b> and click <b>Generate seating</b>. Done.</li></ol>' +
      '<div class="tip">Once your rooms are right, save them as a template (Rooms &amp; Layout) so next term takes thirty seconds.</div>'],
    ['Import a student list from Excel',
      '<ol><li>Your spreadsheet needs columns for first name and surname. Class and status columns are optional, and headers can be named anything.</li>' +
      '<li>In <b>Students</b>, click <b>Import Excel / CSV</b> and choose the file (.xlsx, .xls or .csv).</li>' +
      '<li>The app guesses which column is which — check the dropdowns and fix any it got wrong.</li>' +
      '<li>Choose <b>Replace</b> for a fresh start or <b>Add</b> to top up the existing list, then click Import.</li></ol>' +
      '<div class="tip">If a status column contains a status name (' + esc(statusNames) + ') or one of its import words from Settings, the app assigns that status automatically. Optional Arrangements and Notes columns are imported too.</div>'],
    ['Generate and adjust the seating plan',
      '<ol><li>In <b>Seating Plan</b>, choose the order and click <b>Generate seating</b>. <b>Seating rules</b> sets spacing (every seat, every second seat, checkerboard) and fill direction.</li>' +
      '<li>To swap two students, click the first seat then the second. To move someone into an empty seat, click them then click the gap.</li>' +
      '<li>Students in the yellow panel have no seat yet — click one, then click any empty seat.</li>' +
      '<li>Students whose status goes to a list room (' + esc(listStatusNames || 'none') + ') are listed under that room automatically.</li></ol>' +
      '<div class="tip">Regenerating replaces all seats in seat-grid rooms, so do your manual tweaks last.</div>'],
    ['Keep two students apart',
      '<ol><li>In <b>Seating Plan</b>, click <b>Keep-apart pairs</b>.</li>' +
      '<li>Pick the two students and click <b>Add pair</b>. Add as many pairs as you need.</li>' +
      '<li>Click <b>Generate seating</b> — the app avoids placing them next to each other. <b>Seating rules</b> sets what counts as "next to".</li>' +
      '<li>If a manual move creates a conflict, both seats turn red with a warning mark so you can fix it.</li></ol>'],
    ['Change a student\'s status (' + esc(statusNames) + ')',
      '<ol><li>In <b>Students</b>, click <b>Edit</b> next to the student and change their <b>Status</b>.</li>' +
      '<li>Their seat is released and they move to the matching room list automatically.</li>' +
      '<li>Add any <b>special arrangements</b> (reader, extra time) in the same window — they print on the arrangements sheet.</li>' +
      '<li>Print the paperwork from the <b>Print</b> tab.</li></ol>' +
      '<div class="tip">Changed your mind? Set them back to "' + esc(statusLabel(defaultStatusId())) + '" and they appear in the unseated panel, ready to place.</div>'],
    ['Print sheets for exam day',
      '<ol><li>Go to <b>Print</b>. You do not need to be signed in as an editor.</li>' +
      '<li>Click the sheet you need — a print dialog opens.</li>' +
      '<li>Choose a printer, or choose <b>Save as PDF</b> to email it.</li></ol>' +
      '<div class="tip">Orientation, columns and extra header lines (supervisor, times, instructions) are set in Settings → Print.</div>'],
    ['For general staff (viewers)',
      '<p>No sign-in needed — just open the link. You can:</p>' +
      '<ol><li>Use <b>Lookup</b> to find any student\'s seat on exam day.</li>' +
      '<li>Browse the <b>Seating Plan</b> — it is always the latest version.</li>' +
      '<li><b>Print</b> any sheet.</li></ol>' +
      '<p>You cannot change anything by accident: editing is locked behind the coordinator password.</p>'],
    ['Something looks wrong?',
      '<ol><li><b>"Save failed" showing?</b> Check your internet, then make the change again. Tell the exam coordinator if it keeps happening.</li>' +
      '<li><b>"Someone else saved first"?</b> Another editor changed this session while you had it open. Click <b>Reload latest</b> and redo your change.</li>' +
      '<li><b>A name is misspelled?</b> An editor fixes it under Students then Edit. In an emergency an editor can also fix it in the Google Sheet (Students tab), then refresh the app.</li>' +
      '<li><b>Plan looks out of date?</b> Refresh the page — it always loads the latest shared copy.</li>' +
      '<li><b>Locked out?</b> The exam coordinators hold the editor password; the master copy lives in the Google Apps Script settings.</li></ol>'],
    ['Save a backup, or move your plan to another computer',
      '<ol><li>On <b>Exam Sessions</b>, click <b>Save to file</b>. Every session (students, rooms, seats, keep-apart pairs) and your settings download as one file.</li>' +
      '<li>To load it, sign in as an editor and click <b>Open file</b>. On a single computer you can <b>replace</b> everything or <b>add</b> the file\'s sessions; with shared data, sessions are always <b>added</b> as new ones so nobody\'s work is overwritten.</li></ol>' +
      '<div class="tip">The file contains student names. Keep it in your school OneDrive or Google Drive, not on a USB stick or in email to outside addresses. Save one before each exam period.</div>'],
    ['Customise the app (Settings)',
      '<p>Editors only. Open the <b>Settings</b> tab, make changes, then click <b>Save settings</b>. Settings are shared by every editor and every session.</p>' +
      '<ol><li><b>School &amp; branding</b> — school name, header line, colour and logo, used on screen and on every printed sheet.</li>' +
      '<li><b>Room types</b> — seat-grid or list rooms. Give a room type a print title and it gets its own sheet on the Print tab.</li>' +
      '<li><b>Statuses</b> — rename, recolour, add or remove statuses and choose which room type each one goes to. A status still used by a student cannot be deleted.</li>' +
      '<li><b>Seating defaults</b> — the rules new sessions start with. Each session can change its own under Seating Plan → Seating rules.</li>' +
      '<li><b>Print</b> — orientation, columns, and optional supervisor, time and instruction lines.</li></ol>' +
      '<div class="tip">Blocked seats, aisles, row/seat labels and supervisors are set per room: Rooms &amp; Layout → Edit.</div>']
  ];
  return '<div class="section-head"><div><h2>How-to Guides</h2><p>Click a task to see the steps. Written for busy staff — no technical knowledge needed.</p></div></div>' +
    guides.map(function (g, i) {
      return '<div class="help-item" id="help' + i + '"><button onclick="document.getElementById(\'help' + i + '\').classList.toggle(\'open\')">' +
        g[0] + '<span>&#9662;</span></button><div class="help-body">' + g[1] + '</div></div>';
    }).join('');
}

function buildSeedDB() {
  var db = { version: 1, sessions: [], templates: [], activeSessionId: null };
  var tmplRooms = [
    { name: 'GYM', purpose: 'main', kind: 'seated', rows: 12, seatsPerRow: 18 },
    { name: 'CDV2', purpose: 'special', kind: 'list' },
    { name: 'BL3', purpose: 'withdrawn', kind: 'list' }
  ];
  db.templates.push({ id: uid(), name: 'NAPLAN standard setup (GYM + CDV2 + BL3)', rooms: JSON.parse(JSON.stringify(tmplRooms)) });

  if (SEED_RAW) {
    Object.keys(SEED_RAW).forEach(function (yr) {
      var rooms = JSON.parse(JSON.stringify(tmplRooms)).map(function (r) { r.id = uid(); return r; });
      var byRoomName = {};
      rooms.forEach(function (r) { byRoomName[r.name] = r; });
      var students = SEED_RAW[yr].map(function (x) {
        var st = { id: uid(), first: x.first, last: x.last, klass: '', status: x.status, roomId: null, row: null, seat: null };
        var r = byRoomName[x.room];
        if (r) {
          // A student sitting in a list room is there for that room's reason.
          if (r.purpose === 'special' && st.status === 'Completing') st.status = 'Special Provision';
          if (r.purpose === 'withdrawn' && st.status === 'Completing') st.status = 'Withdrawn';
          st.roomId = r.id;
          if (r.kind === 'seated' && x.row) {
            st.row = parseInt(String(x.row).replace(/\D/g, ''), 10) || null;
            st.seat = parseInt(String(x.seat).replace(/\D/g, ''), 10) || null;
          }
        }
        return st;
      });
      db.sessions.push({
        id: uid(), name: 'NAPLAN 2026 — Year ' + yr, group: 'Year ' + yr, date: '2026-03-11',
        version: 1, loaded: true, rooms: rooms, students: students,
        settings: { sortBy: 'surname', keepApart: [] }
      });
    });
  }
  db.activeSessionId = db.sessions.length ? db.sessions[0].id : null;
  return db;
}

/* =========================== BOOT ============================= */
(async function boot() {
  try {
    await loadDB();
    applyBranding();
    render();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="empty-msg">The app could not start: ' + esc(e.message) + '<br><br>Try refreshing. If it keeps happening, tell the exam coordinator.</div>';
  }
})();
